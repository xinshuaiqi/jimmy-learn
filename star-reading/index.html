{id:'washington',title:'George Washington',cat:'famous',diff:'easy',rating:950,em:'🇺🇸',
passage:`George Washington was born in Virginia in 1732. He grew up on a big farm and loved being outdoors. As a young man he became a soldier and learned how to lead people.

In 1776 the American colonies decided to break away from Britain. Washington was chosen to lead the Continental Army. The war was very hard. His soldiers were often cold, hungry, and tired, but Washington never gave up. He kept his army together and inspired them to keep fighting.

In 1781 the Americans won the war. In 1789 Washington became the first President of the United States. Many people wanted him to be president forever, but Washington believed a leader should not hold power for too long. After two terms, he went home to his farm.

Today Washington is called the "Father of His Country." His face is on the quarter and the one-dollar bill, and the capital city, Washington, D.C., is named after him.`,

{q:'Where can you see Washington\'s face today?',o:['The $5 bill and nickel','The $10 bill and dime','The quarter and $1 bill','The $20 bill'],a:2}]},

{id:'einstein',title:'Albert Einstein',cat:'famous',diff:'easy',rating:950,em:'🧠',
passage:`Albert Einstein was born in Germany in 1879. As a boy he was quiet and loved to wonder how the world worked. He was very smart, but he did not always get top grades. Still, he never stopped asking big questions.

When he grew up, Einstein became a physicist, a scientist who studies how the universe works. In 1905 he shared a famous equation, E = mc². It shows that energy and matter are connected. This idea changed how scientists think about the universe.

Einstein also created the Theory of Relativity, which explains how space, time, and gravity fit together. Today it helps scientists study black holes and even helps GPS satellites keep correct time.

In 1921 Einstein won the Nobel Prize in Physics. People around the world knew him by his kind face and wild, messy hair.

In 1933 he moved to the United States to be safe from danger in Germany. He worked at Princeton University until he died in 1955.`,
q:[
{q:'Where was Einstein born?',o:['France','United States','Germany','Switzerland'],a:2},
{q:'What does E = mc² show?',o:['How fast light travels','Energy and matter are connected','How far away the sun is','How to split an atom'],a:1},
{q:'What prize did Einstein win in 1921?',o:['Nobel Peace Prize','Nobel Prize in Physics','Nobel Prize in Chemistry','A math medal'],a:1},
{q:'Why did Einstein move to the United States?',o:['To learn English','To get a better teaching job','To be safe from danger in Germany','To explore America'],a:2}]},

{id:'curie',title:'Marie Curie',cat:'famous',diff:'medium',rating:1250,em:'⚗️',
passage:`Marie Curie was born in Poland in 1867. At that time, women in Poland were not allowed to attend university. But Marie loved science and refused to give up.

She joined a secret school called the "Flying University," where young Polish women met in hidden places to learn. Later she moved to Paris and studied at the Sorbonne. She worked as a tutor and cleaner to pay for school. In the end she earned degrees in both physics and mathematics.

With her husband Pierre, Marie studied a strange new kind of energy. She named it radioactivity, a word she invented herself. They discovered two new elements: polonium, named after her homeland Poland, and radium.

Marie won the Nobel Prize twice, in Physics in 1903 and in Chemistry in 1911. She is the only person ever to win Nobel Prizes in two different sciences.

Her work helped doctors treat cancer with radiation. During World War I she built mobile X-ray machines to help wounded soldiers. She died in 1934, but her discoveries still help millions of people.`,
q:[
{q:'Why did Marie secretly study in the "Flying University"?',o:['She was too young for school','She had no money','Women were not allowed in Polish universities','The schools were too far'],a:2},
{q:'Which two elements did Marie Curie discover?',o:['Hydrogen and oxygen','Polonium and radium','Carbon and helium','Gold and silver'],a:1},
{q:'How many Nobel Prizes did Marie Curie win?',o:['One','Three','Four','Two'],a:3},
{q:'What word did Marie invent?',o:['Radiation therapy','Radioactivity','Nuclear','X-ray'],a:1},
{q:'What did she build to help soldiers in World War I?',o:['Mobile hospitals','Mobile X-ray machines','Tanks','Radio towers'],a:1}]},

{id:'edison',title:'Thomas Edison',cat:'famous',diff:'easy',rating:950,em:'💡',
passage:`Thomas Edison was born in Ohio in 1847. As a child he was extremely curious and asked so many questions that his teacher called him "addled," which means confused. His mother took him out of school and taught him at home. This gave Edison freedom to try experiments.

Edison became one of the greatest inventors ever. In 1879 he made the first practical electric light bulb. Before that, homes and streets were lit by candles and gas lamps. His bulb brought electric light into everyday life.

He also invented the phonograph, a machine that could record sound and play it back. It was the first music player! He helped create early movie cameras too. His lab in Menlo Park, New Jersey, produced hundreds of inventions.

Edison believed in hard work. He said, "Genius is one percent inspiration and ninety-nine percent perspiration." Perspiration means sweat.

When he died in 1931, Edison held 1,093 patents, the most of any inventor in American history.`,
q:[
{q:'Why did Edison\'s mother teach him at home?',o:['The school was too far','His teacher thought he was confused because of his many questions','He was sick','There were no schools'],a:1},
{q:'What was Edison\'s most famous invention?',o:['The telephone','The phonograph','The practical light bulb','The airplane'],a:2},
{q:'What could the phonograph do?',o:['Take photographs','Record and play sound','Print books','Send messages'],a:1},
{q:'What does "perspiration" mean in Edison\'s quote?',o:['Luck','Sweat, or hard work','Sleep','Money'],a:1}]},

{id:'jobs',title:'Steve Jobs',cat:'famous',diff:'medium',rating:1250,em:'🍎',
passage:`Steve Jobs was born in San Francisco in 1955. He was adopted as a baby by Paul and Clara Jobs, who encouraged his love of electronics. As a teenager he became friends with Steve Wozniak, a brilliant engineer. Together they started a company in a garage.

That company was Apple. In 1977 they released the Apple II, one of the first successful personal computers. Before this, computers were giant machines used only by big companies. Jobs dreamed of putting a computer in every home.

In 1984 Apple released the Macintosh, a computer with pictures called icons and a mouse, instead of hard typed commands. It was a big step forward. But in 1985 Jobs was forced to leave Apple after disagreements.

He did not give up. He started a new company called NeXT and bought a small animation studio that became Pixar, the studio that made Toy Story.

In 1997 Jobs returned to Apple, which was struggling. He led the creation of the iMac, iPod, iPhone, and iPad. Jobs said, "Stay hungry, stay foolish," meaning keep learning and trying new things. He died in 2011.`,

{q:'Which product was NOT made after Jobs returned in 1997?',o:['iPod','iPhone','Apple II','iPad'],a:2}]},

{id:'musk',title:'Elon Musk',cat:'famous',diff:'medium',rating:1250,em:'🚀',
passage:`Elon Musk was born in South Africa in 1971. As a boy he loved science fiction books and dreamed of humans living on other planets. At age 12 he taught himself computer programming and sold his first video game for $500.

He later moved to Canada and then to the United States to study. He started a software company called Zip2 and helped build PayPal, a way to pay money online.

With the money he earned, Musk started two big companies. SpaceX builds rockets and spacecraft. His goal is to help people live on Mars one day. SpaceX has launched astronauts to the International Space Station and built rockets that can land themselves and be used again.

Tesla builds electric cars. Musk believed the world should use fewer gasoline cars to help protect the environment.

Musk is known for setting very big goals. Some people think his goals are too hard, but he keeps trying. His story shows that big dreams need a lot of learning, courage, and hard work.`,
q:[

);

{id:'pilgrims',title:'The Pilgrims and Thanksgiving',cat:'us',diff:'easy',rating:950,em:'🦃',
passage:`In 1620 a group of people called the Pilgrims sailed across the Atlantic Ocean on a ship named the Mayflower. They left England because they wanted the freedom to practice their own religion.

The trip took 66 days and was dangerous. When they finally landed in what is now Massachusetts, winter was starting. They had to build shelters and find food quickly.

The first winter was terrible. Many Pilgrims got sick, and about half of them died.

In the spring, a Native American man named Squanto helped the survivors. He taught them how to plant corn and catch fish. The Wampanoag people shared what they knew and helped the newcomers.

In the fall of 1621 the Pilgrims had a good harvest. They celebrated with a three-day feast and invited their Wampanoag neighbors. People call this the "First Thanksgiving."

Today Americans celebrate Thanksgiving on the fourth Thursday of November. Families share a meal and say thank you for the good things in their lives.`,

{q:'Why did the Pilgrims leave England?',o:['To find gold','To practice their own religion freely','To trade with Native Americans','To build a castle'],a:1},

{id:'revolution',title:'The American Revolution',cat:'us',diff:'medium',rating:1250,em:'🔔',
passage:`In the 1770s America was made up of thirteen colonies ruled by Britain. The colonists had to pay taxes to the British king, but they had no voice in making the laws. Many thought this was unfair. Their slogan was "No taxation without representation!"

In 1773 a group of colonists protested by sneaking onto British ships in Boston Harbor and throwing crates of tea into the water. This is called the Boston Tea Party.

In April 1775 the first shots of the war were fired at Lexington and Concord in Massachusetts. The American Revolution had begun.

On July 4, 1776, leaders signed the Declaration of Independence, which said the colonies were free from British rule. Thomas Jefferson was its main author. It declared that "all men are created equal."

The war lasted until 1781, when General George Washington's army won the Battle of Yorktown. In 1783 Britain officially accepted American independence.

The United States became a new nation built on freedom and self-government. Every July 4 Americans celebrate Independence Day, the nation's birthday.`,
q:[
{q:'What did "No taxation without representation" mean?',o:['No one should pay taxes','Colonists wanted a voice in the laws if they paid taxes','Colonists wanted to be British soldiers','Tea should be free'],a:1},
{q:'What happened at the Boston Tea Party?',o:['Colonists drank tea with the king','Colonists threw British tea into the harbor','Soldiers arrested tea sellers','Colonists opened a tea shop'],a:1},
{q:'Who was the main author of the Declaration of Independence?',o:['George Washington','Benjamin Franklin','Thomas Jefferson','John Adams'],a:2},
{q:'What do Americans celebrate on July 4?',o:['Thanksgiving','Independence Day','Memorial Day','Labor Day'],a:1}]},

{id:'lincoln',title:'Abraham Lincoln',cat:'us',diff:'medium',rating:1250,em:'🎩',
passage:`Abraham Lincoln was born in a small log cabin in Kentucky in 1809. His family was poor and he had little school, but he loved to read. He walked miles to borrow books and read by firelight. This love of learning helped him become a lawyer and then a leader.

In 1860 Lincoln was elected the 16th President. Many Southern states depended on enslaved people to work their farms, and they feared Lincoln would end slavery. Eleven states left the United States and formed the Confederacy. This began the Civil War.

Lincoln believed the country must stay united. In 1863 he issued the Emancipation Proclamation, which declared that enslaved people in the Confederate states were free. It was a historic turning point.

That same year he gave a short, famous speech at Gettysburg. He reminded people that the nation was built on the idea that "all men are created equal."

In 1865 the Union won the Civil War. Sadly, just days later Lincoln was shot at Ford's Theatre in Washington, D.C., and died.

He is remembered as one of America's greatest presidents, a man who kept the nation together and helped end slavery.`,

{id:'greatwall',title:'The Great Wall of China',cat:'china',diff:'easy',rating:950,em:'🏯',
passage:`The Great Wall of China is one of the most amazing structures ever built. All of its parts together stretch for more than 13,000 miles (about 21,000 kilometers) across mountains, deserts, and plains in northern China.

The wall was not built all at once. Different emperors ordered new sections over many centuries. Around 221 BC, Emperor Qin Shi Huang connected older walls into a longer barrier. Many parts that tourists visit today were built during the Ming Dynasty, between 1368 and 1644.

The wall helped protect China from invaders from the north. Watchtowers stood along the wall so soldiers could spot enemies far away and send smoke signals to warn others.

Hundreds of thousands of workers, including farmers, soldiers, and prisoners, helped build it over the years. The work was very hard and dangerous.

Today the Great Wall is a symbol of China's strength and history. In 1987 it was named a UNESCO World Heritage Site, and millions of people visit every year.`,

{q:'Which emperor connected older walls around 221 BC?',o:['Kublai Khan','Qin Shi Huang','Emperor Kangxi','Emperor Wu'],a:1}]},

{id:'silkroad',title:'The Silk Road',cat:'china',diff:'medium',rating:1250,em:'🐪',
passage:`About 2,000 years ago a network of trade routes connected China with Central Asia, the Middle East, and Europe. It was called the Silk Road because China sold its valuable silk cloth along these routes.

The Silk Road was not a single road. It was a web of many paths that stretched for about 4,000 miles. Merchants traveled with camels and horses across hot deserts, tall mountains, and wide grasslands. A trip could take months or even years.

Traders carried silk, spices, gems, glass, and gold. But more than goods traveled along the Silk Road. Ideas, religions, art, and inventions also moved from place to place. Buddhism spread from India to China. Paper and printing, both Chinese inventions, slowly traveled west to Europe.

Not everything that traveled was good. Many historians think that diseases also spread along the trade routes.

In the 1200s an Italian explorer named Marco Polo traveled to China. His stories amazed people in Europe.

Today historians study the Silk Road as one of the most important links between East and West.`,
q:[
{q:'Why was it called the Silk Road?',o:['It was paved with silk','China sold valuable silk along it','It was shaped like a thread','A man named Silk built it'],a:1},
{q:'Which religion spread from India to China along the Silk Road?',o:['Christianity','Islam','Buddhism','Judaism'],a:2},
{q:'Which Chinese inventions traveled west to Europe?',o:['Cars and trains','Paper and printing','Telephones','Light bulbs'],a:1},
{q:'Why did a trip on the Silk Road take so long?',o:['Merchants walked in circles','Travelers crossed deserts and mountains with camels and horses','There were no maps in the world','Traders only traveled in winter'],a:1}]},

{id:'terracotta',title:'The Terracotta Warriors',cat:'china',diff:'medium',rating:1250,em:'🏺',
passage:`In 1974 some farmers digging a well near the city of Xi'an, China, made one of the greatest discoveries of all time. They found pieces of clay statues buried underground. It was the first sign of the Terracotta Army.

The army was made more than 2,000 years ago to guard the tomb of Qin Shi Huang, China's first emperor. In 221 BC he joined many separate kingdoms into one empire. He feared death and wanted an army of clay soldiers to protect him in the next life.

More than 8,000 life-size soldiers have been found, along with horses, chariots, and real weapons. Each soldier has its own face. No two are exactly alike. They were once painted in bright colors, but the paint has faded over time.

Ancient writers said that about 700,000 workers helped build the emperor's tomb. The work lasted many years.

Today the Terracotta Warriors are a UNESCO World Heritage Site and one of China's most famous places to visit. They give us a window into China's ancient world.`,
q:[
{q:'Who discovered the Terracotta Warriors in 1974?',o:['Museum workers','Farmers digging a well','Soldiers on a march','Students on a trip'],a:1},
{q:'Why was the Terracotta Army made?',o:['To train real soldiers','To protect the emperor in the next life','To decorate a palace','To scare animals'],a:1},
{q:'What is special about the soldiers\' faces?',o:['They all look the same','No two faces are exactly alike','They all wear masks','They have no faces'],a:1},
{q:'What happened to the original bright paint?',o:['It was washed off on purpose','It faded over time','It was never there','It turned to gold'],a:1}]},

{id:'egypt',title:'Ancient Egypt and the Pyramids',cat:'world',diff:'easy',rating:950,em:'🔺',
passage:`More than 4,000 years ago a great civilization grew along the Nile River in northeastern Africa. Every year the Nile flooded and left rich soil behind. This helped farmers grow plenty of food.

Ancient Egypt was ruled by powerful leaders called pharaohs. Egyptians believed pharaohs were gods on Earth. When a pharaoh died, he was buried in a special tomb to help him on his journey to the afterlife.

The most famous tombs are the pyramids. The Great Pyramid at Giza was built around 2560 BC and is made of about 2.3 million stone blocks. Skilled workers spent many years building it. It is one of the Seven Wonders of the Ancient World.

Egyptians also invented hieroglyphics, a writing system that uses pictures and symbols. They made a paper-like material called papyrus from reeds that grew along the Nile.

For about 3,000 years, Ancient Egypt was one of the most powerful civilizations in the world.`,
q:[
{q:'Which river helped Egyptian farmers?',o:['The Amazon','The Nile','The Yangtze','The Ganges'],a:1},
{q:'What were Egyptian rulers called?',o:['Kings','Emperors','Pharaohs','Sultans'],a:2},
{q:'What is hieroglyphics?',o:['A type of pyramid','A writing system of pictures and symbols','A kind of boat','A Roman coin'],a:1}]},

{id:'davinci',title:'Leonardo da Vinci',cat:'world',diff:'medium',rating:1250,em:'🎨',
passage:`Leonardo da Vinci was born in Italy in 1452, during a time called the Renaissance, when art and learning were growing quickly in Europe. Leonardo seemed able to do everything. He was a painter, sculptor, architect, musician, scientist, engineer, and inventor.

He is most famous for two paintings, the Mona Lisa and The Last Supper. The Mona Lisa hangs in the Louvre Museum in Paris, where millions of people visit it each year. People still wonder about her mysterious smile.

But Leonardo was much more than a painter. He filled thousands of notebook pages with drawings and ideas. He sketched a flying machine that looked like a helicopter hundreds of years before one was built. He also drew plans for a tank and a robot.

Leonardo studied the human body carefully and drew muscles, bones, and organs in great detail. Many of his drawings are still amazingly accurate.

Leonardo believed that art and science were closely connected. He used math and science to make his paintings look real. He died in 1519, leaving ideas that people still study today.`,
q:[
{q:'In what period was Leonardo born?',o:['The Stone Age','The Renaissance','The Industrial Revolution','The Space Age'],a:1},
{q:'Where is the Mona Lisa displayed?',o:['The British Museum','The Louvre in Paris','The White House','The Great Wall'],a:1},
{q:'What did Leonardo sketch hundreds of years before it was built?',o:['A helicopter-like flying machine','A television','A rocket to Mars','A computer'],a:0},
{q:'What did Leonardo believe about art and science?',o:['They have nothing in common','They are closely connected','Art is not important','Science is too hard'],a:1}]},

{id:'olympics',title:'The Ancient Olympics',cat:'world',diff:'easy',rating:950,em:'🏅',
passage:`The Olympic Games began in Ancient Greece almost 3,000 years ago. The first recorded games were held in 776 BC in a place called Olympia. They took place every four years to honor Zeus, the king of the Greek gods.

In those days only free Greek men could compete. Athletes ran, jumped, wrestled, threw the discus, and raced chariots. Winners did not get medals. They got a crown made of olive leaves. Even so, winning was a great honor, and champions were treated like heroes at home.

The games also helped bring peace. Even when Greek cities were at war, a special truce let athletes and fans travel safely to Olympia.

The ancient Olympics continued for about 1,200 years before they ended around 393 AD.

In 1896 a Frenchman named Pierre de Coubertin helped bring the games back in Athens, Greece. These became the modern Olympics. Now athletes from nearly every country compete together every four years.`,
q:[
{q:'When were the first recorded Olympic Games held?',o:['300 AD','500 BC','776 BC','1000 BC'],a:2},
{q:'What did ancient winners receive?',o:['A gold medal','A crown of olive leaves','A bag of money','A new house'],a:1},
{q:'Who helped bring the Olympics back in 1896?',o:['Zeus','Pierre de Coubertin','Julius Caesar','Leonardo da Vinci'],a:1}]}
);

   text:`More than 2,300 years ago, in 353 BC, the state of Wei attacked the state of Zhao. Wei's army surrounded Zhao's capital, Handan. Zhao was in great danger, so it asked the state of Qi for help.

Qi's army marched toward Wei's capital. When Wei heard the news, its generals were afraid. They gave up the attack on Zhao and rushed home. The long march made them tired. Qi's army was waiting at a place called Guiling. Qi won the battle, and Zhao was saved.

The idiom says: save Zhao by attacking Wei. If you cannot beat the strongest part of an enemy, threaten the thing they must protect.`,

{id:'s03',num:3,grp:1,cat:'s36',
 title:'借刀杀人 · Borrow a Knife',py:'jiè dāo shā rén',en:'Borrow someone else\'s knife',
 diff:'medium',rating:1250,em:'🗡️',src:'history',
 memo:'Let the power of others do the work.',
 parts:[
  {h:'Zi Gong saves his homeland',
   text:`About 484 BC, the state of Qi planned to attack the state of Lu. Lu was the homeland of the wise teacher Confucius. Lu was small, and Qi was very strong. Confucius did not want his home to be hurt.

One of his students, Zi Gong, said, "Let me try." Zi Gong did not carry a sword. He carried words. He traveled to other states and talked with their rulers.

First, he went to Qi. He urged the rulers of Qi to look at a different target, the state of Wu. Then he went to Wu and convinced it to fight Qi. He also warned the state of Jin to be ready.

Soon the big states were busy with each other. Nobody had time to attack Lu. Lu stayed safe.

The idiom means "borrow someone else's knife." It means using the power of others to reach your goal.`,

{id:'s04',num:4,grp:1,cat:'s36',
 title:'以逸待劳 · Wait While They Tire',py:'yǐ yì dài láo',en:'Rest and wait for the tired enemy',
 diff:'easy',rating:950,em:'🥁',src:'history',
 memo:'Rest and wait, then act at the right moment.',
 parts:[
  {h:'Cao Gui and the three drumbeats',
   text:`In 684 BC, the state of Qi attacked the state of Lu. Duke Zhuang of Lu wanted to fight at once. When the Qi drums began to beat, he got ready to charge.

His adviser, Cao Gui, said, "Not yet. Wait." So the Lu soldiers stayed calm. The Qi drums beat a second time. Cao Gui said, "Wait." The drums beat a third time. Now Cao Gui said, "Beat our drum!"

The Lu army charged, and the Qi army ran away. Later, the duke asked why Cao Gui had waited. Cao Gui explained, "A drum gives courage. The first drumbeat makes soldiers brave. The second makes them weaker. By the third, their courage is gone. Ours was full, so we won," he said.

The idiom says: wait while the enemy gets tired. Rest, wait for the right moment, and then act with full strength.`,

{id:'s05',num:5,grp:1,cat:'s36',
 title:'趁火打劫 · Rob a Burning House',py:'chèn huǒ dǎ jié',en:'Take advantage of a fire to rob',

 memo:'When others are distracted, a chance appears. Also ask if it is fair.',

  {h:'Goujian strikes while Wu is away',
   text:`In 482 BC, King Fuchai of Wu wanted to be the strongest ruler of all. He took his best soldiers far north to a big meeting of rulers. Wu's capital was left almost empty.

King Goujian of Yue had been waiting for this moment for years. Wu had once beaten Yue, and Goujian had never forgotten. When he heard that Fuchai's army was far away, he attacked the Wu capital.

The idiom says: rob a burning house. When someone is in trouble or busy with something else, a chance can appear. It is all about good timing.

But a wise person also asks a question: is it fair to use someone's trouble? Goujian felt he had a reason, because Wu had beaten Yue. Think about when you would use this idea, and when you would rather help.`,

{id:'s06',num:6,grp:1,cat:'s36',
 title:'声东击西 · Noise East, Strike West',py:'shēng dōng jī xī',en:'Make noise in the east, strike in the west',

 memo:'Control where your opponent looks.',

  {h:'Han Xin crosses the river',
   text:`In 205 BC, the general Han Xin had to cross the wide Yellow River. His enemy was Wei Bao. Wei Bao's soldiers guarded the main crossing, a place called Linjin. Crossing there would be very dangerous.

So Han Xin put on a show. His soldiers gathered many boats at Linjin. They shouted and made lots of noise, as if they were about to cross. Wei Bao hurried his army to guard Linjin.

But that was a trick. Far upriver, at a place called Xiayang, a hidden group of soldiers tied wooden barrels and jars together. They used them like rafts and crossed quietly. Then they attacked Wei Bao's home area from behind.

The idiom says: make noise in the east, strike in the west. If you control where your enemy looks, you control what happens.`,

   text:`In the famous novel Romance of the Three Kingdoms, Zhuge Liang made a bold promise. He said he could get 100,000 arrows in only three days. Nobody believed him.

The arrows stuck in the straw like needles. Zhuge Liang turned the boats around. They came back loaded with arrows! He had made arrows out of nothing.`,

{id:'s08',num:8,grp:2,cat:'s36',
 title:'暗度陈仓 · Secretly Cross at Chencang',py:'àn dù chén cāng',en:'Openly repair the road, secretly cross at Chencang',
 diff:'medium',rating:1250,em:'🪵',src:'history',
 memo:'Show one plan, but do another.',
 parts:[
  {h:'The road that took years to fix',
   text:`In 206 BC, Liu Bang was sent to a faraway, hilly land. To show he was no danger, he burned the plank road behind him. The plank road was a narrow path built along steep cliffs. Now his enemies felt safe.

Later, Liu Bang's general Han Xin made a plan. He ordered soldiers to repair the burned road, and they worked where everyone could see. Repairing it would take years. The enemy general laughed. He relaxed and kept watching the road.

But the repairs were only a show. Han Xin's main army marched secretly along a different way. It passed through a place called Chencang. The enemy general was surprised, and his army was beaten.

The idiom means "openly repair the road, secretly cross at Chencang." Show one plan, but do another.`,

{id:'s09',num:9,grp:2,cat:'s36',
 title:'隔岸观火 · Watch the Fire from the Far Bank',py:'gé àn guān huǒ',en:'Watch the fire from the other bank',
 diff:'medium',rating:1250,em:'👀',src:'history',
 memo:'Sometimes waiting lets rivals weaken each other.',
 parts:[
  {h:'Cao Cao chooses to wait',
   text:`In 207 AD, two brothers, Yuan Shang and Yuan Xi, were on the run. They had been beaten in battle, and they had few soldiers left. They fled to the far north. They asked a local leader named Gongsun Kang to shelter them.

Cao Cao's generals wanted to chase the brothers. But Cao Cao said, "No. If we push them, they will join forces with Gongsun Kang. If we leave, they will start fighting each other." So Cao Cao led his army home. His generals were surprised, but they obeyed.

Cao Cao was right. Soon Gongsun Kang turned against the brothers himself. He no longer sheltered them, and he handed them over.

The idiom means "watch the fire from the far bank." Sometimes waiting is smarter than rushing. Your rivals may weaken each other while you stay safe.`,

{id:'s10',num:10,grp:2,cat:'s36',
 title:'笑里藏刀 · A Knife Behind a Smile',py:'xiào lǐ cáng dāo',en:'Hide a knife inside a smile',
 diff:'medium',rating:1250,em:'🎭',src:'history',
 memo:'Watch the actions, not just the sweet words.',
 parts:[
  {h:'Lu Xun and the proud general',
   text:`Guan Yu was a famous general. He guarded the important region of Jing Province. He was brave, but he was also very proud.

A young scholar-general named Lu Xun was sent to face him. Lu Xun wrote Guan Yu humble, flattering letters. He praised Guan Yu again and again. He said Guan Yu was far greater than he could ever be. Guan Yu felt pleased. He thought, "This young man is no danger." So he moved many soldiers away from his post.

Then Wu's army struck. Its soldiers crossed the river in boats, dressed as merchants. They took the cities, and Jing Province was lost.

The idiom means "a knife behind a smile." Be careful when sweet words do not match actions. And remember that being too proud can make you careless.`,

  {q:'What does the idiom "a knife behind a smile" mean?',o:['A kind gift','A smiling swordsman','A sharp pencil','Sweet words that hide a harmful plan'],a:3},

{id:'s11',num:11,grp:2,cat:'s36',
 title:'李代桃僵 · Plum Tree for Peach Tree',py:'lǐ dài táo jiāng',en:'The plum tree takes the peach tree\'s place',
 diff:'easy',rating:950,em:'🐎',src:'history',
 memo:'Give up a small thing to win a big thing.',
 parts:[
  {h:'Tian Ji and the horse race',
   text:`Tian Ji liked to race horses against the king of Qi. Each side had three horses: a fast one, a medium one, and a slow one. There were three races. The side that won two races won the game.

The king's horses were a little better than Tian Ji's. So Tian Ji lost again and again. One day he asked his adviser, Sun Bin, for help.

Sun Bin said, "Race your slowest horse against the king's fastest. Race your fastest horse against his medium horse. Race your medium horse against his slowest."

Tian Ji tried it. His slow horse lost the first race. But his fast horse won the second, and his medium horse won the third. Tian Ji won two out of three!

The idiom says: the plum tree takes the place of the peach tree. Give up a small thing to win a big thing.`,

  {q:'What does the idiom "the plum tree takes the place of the peach tree" mean?',o:['Give up a small thing to win a big thing','Plant more trees','Never lose a race','Trade horses for trees'],a:0},

{id:'s12',num:12,grp:2,cat:'s36',
 title:'顺手牵羊 · Lead Away a Sheep in Passing',py:'shùn shǒu qiān yáng',en:'Lead away a sheep as you pass by',
 diff:'medium',rating:1250,em:'🐑',src:'history',
 memo:'Notice a small chance and grab it fast.',
 parts:[
  {h:'The tip that burned the grain',
   text:`In 200 AD, the battle at Guandu was going badly for Cao Cao. His army was smaller than Yuan Shao's. He was also running low on food.

Then something surprising happened. A man named Xu You left Yuan Shao and came to Cao Cao. He brought a secret tip. "Yuan Shao keeps his grain at a place called Wuchao," he said. "It is guarded by only a few soldiers."

Cao Cao did not wait. He saw a small chance, and he grabbed it. That night, he led a small force to Wuchao. His men burned the grain. Without food, Yuan Shao's army lost heart, and Cao Cao won.

The idiom means "lead away a sheep as you pass by." When a small chance appears, take it quickly. This is one famous example of the idea.`,

{id:'s13',num:13,grp:3,cat:'s36',title:'打草惊蛇 · Beat the Grass, Startle the Snake',py:'dǎ cǎo jīng shé',en:'Beat the grass and startle the snake',diff:'easy',rating:950,em:'🐍',src:'history',
 memo:"Do not warn your target before you are ready.",
 parts:[{h:'Wang Lu and the report',
  text:`Long ago, in the Tang dynasty, a man named Wang Lu worked as a county official. It was his job to keep the town honest.

One day, a report came to his desk. It said that his clerks were taking bribes. A bribe is secret money that people pay to get special treatment.

Wang Lu read the report slowly. Then he picked up his brush and wrote one sentence on it. "You have beaten the grass, but I am the snake, and I am already startled."

What did he mean? When you hit the grass, a hidden snake gets scared and slithers away. Wang Lu understood that a loud, early attack had warned the one who was hiding. After that, the snake would be much harder to catch.

The lesson is simple. Do not alarm your target before you are ready. Make a quiet plan first, and then act.`,
  scene:{bg:'day',ground:'grass',items:[{e:'🌿',x:110,y:150,s:60},{e:'🐍',x:150,y:172,s:34},{e:'🧑',x:270,y:150,s:62,flip:true},{e:'📜',x:330,y:118,s:32},{e:'🏯',x:350,y:92,s:44}]},
  cap:'Wang Lu beats the grass, and the snake slips away.'}],

  {q:"In this story, what does the word 'bribe' mean?",o:["A gift for a friend","A prize for a race","Secret money paid to get special treatment","Money you earn from farming"],a:2},
  {q:"Why does a hidden snake slither away when someone beats the grass?",o:["It gets scared and wants to escape.","It wants to eat the grass.","It is looking for water.","It is calling its friends."],a:0},
  {q:"What is the lesson of 'beat the grass, startle the snake'?",o:["Always act as loudly as you can.","Never make plans.","Do not warn your target before you are ready.","Snakes are good helpers."],a:2}]},

{id:'s14',num:14,grp:3,cat:'s36',title:'借尸还魂 · Borrow a Body, Bring Back a Spirit',py:'jiè shī huán hún',en:'Borrow a body to bring back a spirit',diff:'medium',rating:1250,em:'👑',src:'history',
 memo:"An old, loved name can bring people together again.",
 parts:[{h:'A king found with the sheep',
  text:`Chu was once a great state. Then a powerful state called Qin conquered it. But the people of Chu did not forget their home. They still loved the names of their old kings.

In 208 BC, a general named Xiang Liang led an army against Qin. He wanted more people to join him. He needed one thing: a name that people trusted.

Then Xiang Liang found a young man named Xiong Xin. Xiong Xin was a grandson of an old king of Chu. He was herding sheep to earn his living.

Xiang Liang made Xiong Xin the new king. He gave him the famous old title, King Huai of Chu. The name did its work. Crowds of Chu people hurried to join the army, because the name felt like home.

The stratagem is called "borrow a body to bring back a spirit." Something old seemed finished, but it was given new life. The lesson is that a familiar name or idea can bring people together.`,
  scene:{bg:'day',ground:'grass',items:[{e:'🐑',x:80,y:165,s:44},{e:'🐑',x:135,y:172,s:36},{e:'🤴',x:225,y:148,s:66},{e:'👑',x:225,y:98,s:28},{e:'🧑',x:315,y:152,s:56,flip:true},{e:'🚩',x:360,y:110,s:34}]},
  cap:'Xiang Liang crowns the shepherd Xiong Xin as king.'}],

  {q:"In this story, what does 'borrow a body to bring back a spirit' mean?",o:["Using an old name or idea to give something new life","Burying a king in the ground","Telling ghost stories at night","Building a new city quickly"],a:0},
  {q:"Why did many people join the army after Xiong Xin became king?",o:["They were paid gold coins.","They were afraid of Xiang Liang.","The name of the old Chu king felt like home.","They wanted to herd sheep."],a:2},
  {q:"Which is the best example of this idea?",o:["A cook burns the soup.","A runner starts early.","A student forgets homework.","A club brings back its old, loved team name to gather members again."],a:3}]},

{id:'s15',num:15,grp:3,cat:'s36',title:'调虎离山 · Lure the Tiger Down the Mountain',py:'diào hǔ lí shān',en:'Lure the tiger away from the mountain',diff:'easy',rating:950,em:'🐯',src:'history',
 memo:"Pull a strong enemy away from the place where it is strongest.",
 parts:[{h:'The strong city of Lujiang',
  text:`Lujiang was a strong city. It had high walls and many soldiers. A young leader named Sun Ce wanted it, but he knew an attack on the walls would cost too much.

The ruler of Lujiang was named Liu Xun. Sun Ce thought of a plan. He sent Liu Xun rich gifts and kind words. Then he said that a place called Shangliao kept attacking him, and he begged Liu Xun for help.

Liu Xun was proud to be asked. He marched out of his city with his army.

While Liu Xun was away, Sun Ce rushed to Lujiang. The city was almost empty. He took it without a long fight.

A tiger is strongest on its own mountain. If you can lure it down to flat land, it loses its power. That is the idea of "lure the tiger down the mountain."`,

  {q:"What did Sun Ce ask Liu Xun to do?",o:["Give him the city","Join a feast","Help him against Shangliao","Teach his soldiers"],a:2},
  {q:"What does 'lure the tiger down the mountain' mean?",o:["Climb a mountain very fast","Catch a real tiger in a cage","Hide in the mountains","Pull a strong enemy away from the place where it is strongest"],a:3},
  {q:"Why was Lujiang easy to take?",o:["Its walls had fallen down.","Liu Xun had taken his army away.","The people opened the gates for a feast.","Sun Ce had the biggest army in the world."],a:1}]},

{id:'s16',num:16,grp:3,cat:'s36',title:'欲擒故纵 · Let Go to Catch',py:'yù qín gù zòng',en:'To catch, first let go',diff:'medium',rating:1250,em:'🧠',src:'novel',
 memo:"Patience and respect win hearts better than force.",
 parts:[{h:'Seven times, seven times free',
  text:`This story comes from the famous novel Romance of the Three Kingdoms. A leader in the south, named Meng Huo, kept fighting the state of Shu. The wise Zhuge Liang led the Shu army to deal with him.

Zhuge Liang could have defeated Meng Huo by force. But that would only make the southern people angry. He wanted something better. He wanted Meng Huo to truly agree.

So Zhuge Liang captured Meng Huo. Then he let him go. Meng Huo went home and said he was not beaten. He fought again, and Zhuge Liang captured him again, and let him go again.

This happened seven times! Each time, Zhuge Liang stayed calm and kind.

At last, Meng Huo felt ashamed. He said, "Your Excellency has the power of heaven. We southerners will never rebel again." He meant it from his heart.

The idea is "to catch, first let go." If you rush and force people, they may turn against you. If you are patient and respectful, they may follow you willingly.`,

  cap:'Zhuge Liang and Meng Huo at last agree.'}],
 q:[
  {q:"How many times did Zhuge Liang capture Meng Huo?",o:["Three","Five","Seven","Nine"],a:2},
  {q:"In this story, what does 'to catch, first let go' mean?",o:["Letting prisoners run away because you are lazy","Being patient so people agree with you from the heart","Throwing a net into a river","Chasing someone faster"],a:1},
  {q:"Why did Zhuge Liang not simply win by force?",o:["He had no soldiers.","He did not like to travel.","Meng Huo was too strong.","Force would only make the southern people angry."],a:3},
  {q:"What finally made Meng Huo stop fighting?",o:["He felt ashamed and truly respected Zhuge Liang.","Zhuge Liang gave him a castle.","He fell sick.","His army ran away."],a:0}]},

{id:'s17',num:17,grp:3,cat:'s36',title:'抛砖引玉 · Toss a Brick, Gain Jade',py:'pāo zhuān yǐn yù',en:'Toss out a brick to attract jade',diff:'easy',rating:950,em:'🧱',src:'history',
 memo:"Offer something small to get something much better.",
 parts:[
  {h:'The firewood trick',
   text:`About 700 BC, the army of Chu wanted to take a small walled state called Jiao. Jiao was well defended, so Chu needed a clever plan.

An adviser had an idea. Send men to cut firewood, but do not give them any weapons. Jiao's soldiers would be tempted.

The next day, Jiao's soldiers caught some woodcutters and took their wood. The following day, more woodcutters came, and Jiao's soldiers caught even more.

Soon the soldiers of Jiao felt very sure of themselves. They stopped being careful. Then one day, many of them rushed out of the walls to chase the woodcutters. Chu's army had been hiding. It jumped out and won.`,
   scene:{bg:'day',ground:'grass',items:[{e:'🌳',x:55,y:108,s:46},{e:'🧑‍🌾',x:140,y:152,s:56},{e:'🪵',x:195,y:172,s:32},{e:'🧑',x:240,y:150,s:56,flip:true},{e:'🏰',x:335,y:105,s:58}]},
   cap:'The woodcutters are bait for the soldiers of Jiao.'},
  {h:'Two lines of poetry',
   text:`There is another story about this idea. In the Tang dynasty, a poet named Zhao Gu visited a temple. He wrote just two lines of a poem on a wall. He hoped a better poet would finish it.

Another poet, Chang Jian, saw the lines. He added two much better lines. People said that Zhao Gu had tossed out a brick, and Chang Jian had given back a piece of jade.

A brick is plain. Jade is a precious stone. The idiom means that you offer something small to get something much better.`,
   scene:{bg:'indoor',ground:'none',items:[{e:'📜',x:200,y:80,s:46},{e:'👨',x:100,y:150,s:60},{e:'👨',x:300,y:150,s:60,flip:true},{e:'🖌️',x:205,y:150,s:28}]},
   cap:'Two poets finish a poem together.'}],
 q:[

  {q:"Why did Jiao's soldiers finally rush out of the walls?",o:["They were told to by their king.","They saw a fire.","They grew careless and wanted to chase the woodcutters.","They wanted to build a bridge."],a:2},
  {q:"In the poem story, what are the 'brick' and the 'jade'?",o:["Chang Jian is the brick; the temple is the jade.","Zhao Gu's two lines are the brick; Chang Jian's better lines are the jade.","The wall is the brick; the poem is the jade.","Both are real stones in the temple."],a:1},
  {q:"What does the idiom 'toss a brick to gain jade' mean?",o:["Throw stones at your enemies","Build a house with bricks","Offer something small to get something much better","Buy jewelry cheaply"],a:2}]},

{id:'s18',num:18,grp:3,cat:'s36',title:'擒贼擒王 · Catch the Leader First',py:'qín zéi qín wáng',en:'To catch bandits, catch their chief',diff:'medium',rating:1250,em:'🏹',src:'history',
 memo:"Go after the most important target first.",
 parts:[{h:'Find the leader',
  text:`In the Tang dynasty, a brave commander named Zhang Xun defended a city. A huge army, led by a man named Yin Ziqi, surrounded it.

Zhang Xun knew that if he could stop the enemy leader, the whole army might give up. But which man was the leader? From far away, everyone looked the same.

So Zhang Xun tried a clever test. His soldiers shot arrows made of straw. The enemy soldiers thought the arrows were real. They cheered and pointed toward their commander.

Now Zhang Xun knew who the leader was! An archer named Nan Jiyun took careful aim. He shot and wounded Yin Ziqi. The enemy army pulled back.

Later, the poet Du Fu wrote: "To shoot a rider, shoot his horse first. To catch a robber, catch the chief first."

That is the idea of "catch the leader first." Do not waste your effort on small things. Find the most important target.`,
  scene:{bg:'dusk',ground:'grass',items:[{e:'🏯',x:65,y:105,s:52},{e:'🧑',x:130,y:150,s:62},{e:'🏹',x:190,y:150,s:36},{e:'🌾',x:235,y:170,s:28},{e:'🐎',x:325,y:155,s:58,flip:true},{e:'🎯',x:355,y:100,s:30}]},
  cap:'Zhang Xun tests who the enemy leader is.'}],
 q:[
  {q:"How did Zhang Xun find out who the enemy leader was?",o:["He sent a spy.","He used straw arrows, and the enemy soldiers cheered and pointed.","He asked a prisoner.","He watched the flags."],a:1},
  {q:"What does 'catch the leader first' mean?",o:["Chase the fastest runner","Let others do the work","Surrender early","Go after the most important target first"],a:3},
  {q:"Why did Zhang Xun want to stop the enemy leader?",o:["If the leader was stopped, the whole army might give up.","The leader had a big horse.","The leader was his brother.","He wanted a new hat."],a:0},
  {q:"Which poet wrote about shooting the horse first?",o:["Li Bai","Du Fu","Zhang Xun","Nan Jiyun"],a:1}]},

{id:'s19',num:19,grp:4,cat:'s36',title:'釜底抽薪 · Take the Firewood from Under the Pot',py:'fǔ dǐ chōu xīn',en:'Remove the firewood from under the pot',diff:'easy',rating:950,em:'🔥',src:'history',
 memo:"Cut the supply, and a strong enemy becomes weak.",
 parts:[{h:'Raiding the grain',
  text:`A big army needs lots of food. Without grain, even the bravest soldiers cannot fight. This is the idea behind "take the firewood from under the pot."

About 204 BC, two rivals fought for China. One was Liu Bang of Han. The other was Xiang Yu of Chu. Xiang Yu's army was strong, and Han could not beat it in open battle.

So a Han general named Peng Yue tried something different. He and his men went behind Chu's army. They found the wagons that carried grain, and they burned the supplies. Then they slipped away before anyone could catch them.

Xiang Yu rushed back to chase Peng Yue. But Peng Yue kept raiding again and again. Chu's army grew hungry and tired.

If you boil water, you can stir it, fan it, or fight it. But if you take the firewood away, the water cools. Cut the supply, and the strong enemy becomes weak.`,
  scene:{bg:'night',ground:'grass',items:[{e:'🌙',x:350,y:45,s:30},{e:'🧑',x:130,y:150,s:62},{e:'🔥',x:250,y:150,s:52},{e:'🌾',x:235,y:172,s:34},{e:'🐴',x:330,y:160,s:50,flip:true},{e:'🍚',x:80,y:172,s:24}]},
  cap:'Peng Yue burns the grain wagons at night.'}],
 q:[
  {q:"What did Peng Yue burn?",o:["Chu's boats","Chu's grain supplies","A bridge","A castle"],a:1},
  {q:"What does 'take the firewood from under the pot' mean?",o:["Cook dinner for the soldiers","Break a cooking pot","Light a big fire","Stop a problem by cutting off what feeds it"],a:3},
  {q:"Why did Xiang Yu's army grow hungry and tired?",o:["Peng Yue kept raiding its supplies, so Xiang Yu had to keep rushing back.","The soldiers refused to eat.","It was winter.","Chu had no wagons."],a:0},
  {q:"Which is the best example of this stratagem today?",o:["A boy runs faster than his friend.","A girl paints a big sign.","A town stops a flood by closing the gate where the water comes in.","A cook buys a new spoon."],a:2}]},

{id:'s20',num:20,grp:4,cat:'s36',title:'混水摸鱼 · Catch Fish in Muddy Water',py:'hùn shuǐ mō yú',en:'Fish in muddy water',diff:'medium',rating:1250,em:'🐟',src:'history',
 memo:"When everything is confusing, the one with a plan can win.",
 parts:[{h:'The disguised soldiers',
  text:`About 280 AD, the state of Western Jin wanted to conquer the state of Wu. A Jin general named Du Yu made a bold plan.

One night, Du Yu sent an officer named Zhou Zhi across the river with 200 soldiers. They put on Wu uniforms so no one would notice them. They hid near the city of Yuexiang.

The next day, the Wu general, Sun Xin, led his army out to fight. Jin's army beat him back, and his soldiers ran toward the city gate. Now came the surprise. Zhou Zhi's hidden men jumped in and mixed with the running Wu soldiers. In the noise and dust, nobody could tell who was who.

The hidden soldiers entered the city with the crowd. Inside, they set fires and made more confusion. Zhou Zhi captured the general Sun Xin, and the city fell.

The idiom is "catch fish in muddy water." When water is muddy, fish cannot see the net. When there is confusion, the one with a plan can win.`,
  scene:{bg:'night',ground:'water',items:[{e:'🛶',x:90,y:160,s:48},{e:'🌊',x:160,y:178,s:36},{e:'🥷',x:225,y:150,s:56},{e:'🏯',x:315,y:105,s:56},{e:'🔥',x:355,y:150,s:30},{e:'🌙',x:45,y:45,s:28}]},
  cap:'Soldiers in disguise slip into the city.'}],
 q:[
  {q:"What did Zhou Zhi's soldiers wear?",o:["Jin armor with red flags","Farmer clothes","Merchant robes","Wu uniforms"],a:3},
  {q:"What does 'catch fish in muddy water' mean?",o:["Go fishing in a river","Clean dirty water","Use confusion to win when others cannot see clearly","Hide under a boat"],a:2},
  {q:"Why could Zhou Zhi's men enter the city?",o:["They broke the gate with a log.","They mixed in with the running Wu soldiers.","The guards invited them.","They climbed ladders."],a:1},

{id:'s21',num:21,grp:4,cat:'s36',title:'金蝉脱壳 · The Golden Cicada Sheds Its Shell',py:'jīn chán tuō qiào',en:'The golden cicada leaves its shell',diff:'medium',rating:1250,em:'🪵',src:'novel',
 memo:"Leave a decoy behind and slip away safely.",
 parts:[{h:'The wooden Zhuge Liang',
  text:`This story is from the novel Romance of the Three Kingdoms. Zhuge Liang, the wise leader of Shu, was camped with his army. His rival, Sima Yi, was camped nearby. Zhuge Liang became very ill.

He knew he would not get better. He gave his officers a secret order. When he passed away, they should not cry out. They should retreat quietly. They should also carve a wooden statue of him and put it in a carriage.

The officers followed the plan. When Zhuge Liang had passed away, the Shu army began to retreat slowly. Sima Yi's scouts saw the army leaving, and Sima Yi gave chase.

Suddenly, Shu's soldiers turned around, and their flags and drums were ready. In the middle sat Zhuge Liang in his carriage! Sima Yi was shocked. He thought it was a trap, and he ran. The Shu army got home safely.

People still say: "A dead Zhuge Liang frightens a living Sima Yi." The idea of "the golden cicada sheds its shell" is to leave a shell, or decoy, behind and slip away.`,
  scene:{bg:'dusk',ground:'grass',items:[{e:'🧑‍🏫',x:200,y:150,s:60},{e:'🪵',x:250,y:172,s:30},{e:'🚩',x:110,y:110,s:38},{e:'🥁',x:140,y:168,s:34},{e:'🐎',x:325,y:155,s:54,flip:true},{e:'😮',x:350,y:105,s:30}]},
  cap:'Sima Yi sees the wooden Zhuge Liang and runs.'}],
 q:[
  {q:"What did Zhuge Liang tell his officers to put in a carriage?",o:["A bag of gold","A war drum","A wooden statue of himself","His sword"],a:2},
  {q:"In this story, what does the 'shell' mean?",o:["A sea animal","A decoy left behind while the real army slips away","A warm coat","A hard hat"],a:1},
  {q:"Why did Sima Yi run away?",o:["He lost his horse.","He saw a storm.","He was called home.","He thought it was a trap."],a:3},
  {q:"What does the saying 'a dead Zhuge Liang frightens a living Sima Yi' show?",o:["Zhuge Liang's clever plan still scared his rival","Sima Yi was a very kind man","Zhuge Liang had not really died","Statues can talk"],a:0}]},

{id:'s22',num:22,grp:4,cat:'s36',title:'关门捉贼 · Shut the Door to Catch the Thief',py:'guān mén zhuō zéi',en:'Close the door to catch the thief',diff:'medium',rating:1250,em:'🚪',src:'history',
 memo:"Close the exits first, then deal with the trapped enemy.",
 parts:[{h:'The trap at Changping',
  text:`In 260 BC, the states of Qin and Zhao faced each other at a place called Changping. The war went on for a long time. Zhao had a careful old general, and he kept his army safe.

The king of Zhao grew impatient. He replaced the old general with a young man named Zhao Kuo. Zhao Kuo had read many books about war. But he had never fought in a real battle. People said he talked about war only on paper.

Qin's general, Bai Qi, saw his chance. He pretended to retreat. Zhao Kuo thought he was winning, and he chased Qin's army. Then Qin closed the door behind him. Qin soldiers blocked both ends of the road and cut off Zhao's food.

Zhao's army was trapped. The soldiers grew hungry and could not escape. In the end, they had to give up.

The idea is "shut the door to catch the thief." First close all the exits. Then deal with the trapped enemy. The story also reminds us that book learning needs real practice.`,
  scene:{bg:'dusk',ground:'stone',items:[{e:'⛰️',x:60,y:108,s:60},{e:'⛰️',x:340,y:108,s:60},{e:'🚪',x:200,y:168,s:36},{e:'🧑',x:200,y:150,s:54},{e:'🧱',x:120,y:165,s:42},{e:'🧱',x:280,y:165,s:42}]},
  cap:'The road is blocked at both ends.'}],
 q:[
  {q:"Who replaced the careful old general of Zhao?",o:["Bai Qi","Zhao Kuo","Sun Bin","Fan Ju"],a:1},
  {q:"What does 'only on paper' mean in this story?",o:["Using paper as armor","Writing long letters home","Drawing maps in the sand","Knowing war only from books, not from real experience"],a:3},
  {q:"How did Qin trap the Zhao army?",o:["They blocked both ends of the road and cut off the food.","They built a wall of snow.","They flooded the valley.","They set the woods on fire."],a:0},
  {q:"What is the lesson of 'shut the door to catch the thief'?",o:["Always keep your doors open","Never chase anyone","Close the exits first, then handle the trapped enemy","Lock your house at night"],a:2}]},

{id:'s23',num:23,grp:4,cat:'s36',title:'远交近攻 · Befriend the Far, Attack the Near',py:'yuǎn jiāo jìn gōng',en:'Befriend far states, attack near ones',diff:'easy',rating:950,em:'🗺️',src:'history',
 memo:"Be friendly with those far away, and focus on what is close.",
 parts:[{h:'Fan Ju gives advice',
  text:`About 270 BC, the state of Qin was strong. Its king wanted to take over more land. He asked an adviser named Fan Ju what to do.

The king wanted to attack Qi, a rich state far away. Fan Ju said no. Qi is far, he said. Your army would have to march a long way. Even if you win, it will be hard to keep land so far from home. And the states nearby will grow stronger while your army is away.

Then Fan Ju gave his advice. Make friends with the faraway states. Attack the nearby states, one at a time.

Think of a map. Your closest neighbors are the biggest worry. A faraway state cannot reach you quickly. When you take the land next door, it joins your own land and stays safe.

The idea is called "befriend the far, attack the near."`,
  scene:{bg:'day',ground:'grass',items:[{e:'🏰',x:70,y:105,s:56},{e:'🏰',x:335,y:105,s:34},{e:'🤴',x:150,y:150,s:62},{e:'🧑',x:240,y:150,s:60,flip:true},{e:'📜',x:195,y:100,s:30},{e:'🤝',x:300,y:165,s:30}]},
  cap:'Fan Ju shows the king a plan on the map.'}],
 q:[
  {q:"Which state did the king first want to attack?",o:["Wu","Chu","Qi","Yue"],a:2},
  {q:"Why did Fan Ju say attacking a faraway state was a bad idea?",o:["It is hard to keep land far from home, and nearby states grow stronger.","The roads were closed for repair.","The far state had no food.","Qin's king was afraid of boats."],a:0},
  {q:"What does 'befriend the far, attack the near' mean?",o:["Make friends with everyone nearby","Be friendly with distant states and deal with nearby states first","Never fight anyone","March far away first"],a:1},
  {q:"When you win the land next door, what happens?",o:["It disappears","It floats away","It becomes a faraway state","It joins your own land and stays safe"],a:3}]},

{id:'s24',num:24,grp:4,cat:'s36',title:'假道伐虢 · Borrow the Road to Attack Guo',py:'jiǎ dào fá guó',en:'Borrow a road to attack Guo',diff:'easy',rating:950,em:'🏺',src:'history',
 memo:"Friends who depend on each other should help each other.",
 parts:[{h:'Lips and teeth',
  text:`About 655 BC, the state of Jin wanted to attack the state of Guo. There was a problem. To reach Guo, Jin's army had to go through a small state called Yu.

Jin's leader had a plan. He sent gifts to Yu's ruler: a beautiful piece of jade and some fine horses. Then he asked, "May we borrow your road to attack Guo?"

Yu's wise adviser, Gong Zhiqi, was worried. "Yu and Guo are like lips and teeth," he said. "If the lips are gone, the teeth will be cold."

But the ruler of Yu loved the gifts. He did not listen. He let Jin's army pass.

Jin defeated Guo. On the way home, Jin's army took Yu as well! The lips were gone, and the teeth were cold. The idiom for this means that friends who depend on each other should help each other.`,
  scene:{bg:'day',ground:'grass',items:[{e:'🏰',x:60,y:106,s:46},{e:'🏰',x:335,y:106,s:46},{e:'🐎',x:150,y:160,s:46},{e:'🏺',x:215,y:172,s:34},{e:'💎',x:250,y:162,s:26},{e:'🧑',x:285,y:150,s:58,flip:true}]},
  cap:'Gifts of jade and horses open the road.'}],
 q:[
  {q:"What gifts did Jin send to Yu?",o:["Gold swords","Jade and fine horses","Silk and rice","Drums and flags"],a:1},
  {q:"What did Gong Zhiqi mean by 'lips and teeth'?",o:["Yu's soldiers had sore mouths","Jin wanted to bring dinner","Both states had long bridges","Guo and Yu depend on each other, so if one falls the other is in danger"],a:3},
  {q:"Why did Yu's ruler let Jin pass?",o:["Jin's army was too big.","He wanted to attack Guo too.","He loved the gifts and did not listen to the warning.","He did not know about the plan."],a:2},
  {q:"What happened to Yu at the end?",o:["Jin took Yu on the way home.","Yu became stronger.","Guo helped Yu.","Yu moved away."],a:0}]}
);

{id:'s25',num:25,grp:5,cat:'s36',
 title:"偷梁换柱 · Swap the Beams and Pillars",

 memo:"Keep the outside the same, but secretly change the inside.",
 parts:[
  {h:'The cat and the prince',
   text:`This is an old story from Chinese opera. It is not real history, but people love to tell it.

Long ago, two queens in the Song palace were waiting for babies. Both wanted a son. One queen had a sneaky helper.

When the first queen's baby prince was born, the helper made a secret plan. She took the baby away. In his place, she put a cat dressed in baby clothes! Then she told everyone that the queen had given birth to a cat.

A kind servant saw what had happened. He carried the real baby out of the palace and kept him safe. Many years later, the truth came out, and the prince came home.

The bundle in the blanket looked the same on the outside. But the inside was changed. That is the idea of swapping the beams and pillars.`,

{id:'s26',num:26,grp:5,cat:'s36',
 title:"指桑骂槐 · Point at the Mulberry, Scold the Locust",
 py:'zhǐ sāng mà huái', en:"Point at the mulberry tree and scold the locust tree",
 diff:'medium', rating:1250, em:'🌳', src:'history',
 memo:"Talk about one thing to teach about another.",
 parts:[
  {h:'Zou Ji and the mirror',
   text:`Zou Ji lived in the state of Qi long ago. He was tall and handsome, and he knew it. One morning he asked his wife, "Who is more handsome, me or Mr. Xu?" Mr. Xu was famous for his good looks.

"You are, of course!" said his wife. His second wife said the same. So did a visitor. But later Zou Ji saw Mr. Xu in person. He looked at him closely, then looked in his mirror. Mr. Xu was clearly more handsome!

Zou Ji thought hard. "My wife loves me. My second wife is afraid of me. The visitor wants a favor. So they all said what I wanted to hear," he thought.

Zou Ji did not say "You are all flatterers" to King Wei of Qi. He told the king his own story instead. "Your Majesty, everyone around you loves you, fears you, or wants something. They may not tell you the truth." The king listened. He asked people to point out his mistakes, and Qi grew stronger. Zou Ji pointed at one tree to teach about another.`,

{id:'s27',num:27,grp:5,cat:'s36',
 title:"假痴不癫 · Act Foolish but Stay Wise",
 py:'jiǎ chī bù diān', en:"Pretend to be foolish, but do not be crazy",
 diff:'medium', rating:1250, em:'🍲', src:'history',
 memo:"Looking weak for a while can help you win later.",
 parts:[
  {h:'Sima Yi fools the spy',
   text:`Sima Yi was an old and clever general in the kingdom of Wei. A young leader named Cao Shuang did not trust him. So Cao Shuang sent a man to check on Sima Yi.

Sima Yi had a plan. When the man arrived, Sima Yi lay in bed and acted very sick. His maids helped him sit up. He spilled soup all over his clothes. He pretended he could not hear well and mixed up every answer.

The man went back to Cao Shuang. "Sima Yi is old and weak," he said. "He is no danger." So Cao Shuang relaxed.

Many months later, Cao Shuang left the city with the emperor. Suddenly Sima Yi jumped up, healthy and strong. He took control of the capital while Cao Shuang was away.

Sima Yi acted foolish, but he was never foolish. He stayed wise inside. In real life, honesty is best. This trick is a story about being patient.`,

{id:'s28',num:28,grp:5,cat:'s36',
 title:"上屋抽梯 · Remove the Ladder",
 py:'shàng wū chōu tī', en:"Go up to the roof, then remove the ladder",
 diff:'easy', rating:950, em:'🪜', src:'novel',
 memo:"Close the other doors so the choice is clear.",
 parts:[
  {h:'Liu Qi and the ladder',
   text:`This story is from the famous novel Romance of the Three Kingdoms.

Liu Qi was a young lord. His stepmother wanted him gone, so he was in danger. He asked a very clever man, Zhuge Liang, for help. But Zhuge Liang said no. "This is a family matter," he said. "I should not get involved."

Liu Qi had an idea. He invited Zhuge Liang to a meal on the top floor of a tall building. They climbed a ladder to get there. While they ate, Liu Qi quietly had the ladder taken away.

"Now no one can hear us, and we cannot go down," said Liu Qi. "Please tell me what to do."

Zhuge Liang laughed. Then he gave good advice. He told Liu Qi to ask for a post far away in a place called Jiangxia. There he would be safe.

Removing the ladder meant there was only one choice left: talk.`,

{id:'s29',num:29,grp:5,cat:'s36',
 title:"树上开花 · Flowers on a Tree",
 py:'shù shàng kāi huā', en:"Make flowers bloom on a tree",
 diff:'easy', rating:950, em:'🌸', src:'novel',
 memo:"Make a small force look big.",
 parts:[
  {h:'Zhang Fei at the bridge',
   text:`In the famous novel Romance of the Three Kingdoms, Zhang Fei faced a big problem. Cao Cao's huge army was chasing his friends. Zhang Fei had only a few riders.

He had a clever idea. He told his riders to go into the woods behind the bridge. "Tie branches to your horses' tails," he said. "Then ride back and forth."

The horses ran through the woods. The branches dragged along the ground, and big clouds of dust rose up. From far away, it looked like a giant army was hiding there!

Zhang Fei stood alone on the bridge at Changban. He held his long spear and shouted in a thunder voice, "I am Zhang Fei! Come and fight me!"

Cao Cao saw the dust and heard the shout. "It must be a trap," he thought. His army stopped. The idea is like tying paper flowers to a bare tree. From far away, the tree looks full of blossoms.`,

{id:'s30',num:30,grp:5,cat:'s36',
 title:"反客为主 · Turn Guest into Host",

 diff:'medium', rating:1250, em:'🤝', src:'history',
 memo:"Start small as a guest, then step by step take the lead.",
 parts:[
  {h:'Liu Bei comes to Yi Province',
   text:`Liu Bei was a leader with a small army. He did not have land of his own. Then a ruler named Liu Zhang invited him to Yi Province. "Please come and help me fight my enemies," said Liu Zhang.

So Liu Bei came as a guest. He was polite and helpful. His soldiers worked hard, and the people liked him. Slowly, Liu Bei made friends. He also took control of key places.

At first he was only a guest in Liu Zhang's house. But step by step, he grew stronger. In time, Yi Province became Liu Bei's home base. The guest had become the host!

That is the meaning of turning guest into host. You begin in a weaker place, then slowly move to the leading place. Some people say Liu Bei was not very fair to Liu Zhang. A wise person also asks, "Is it fair?"`,

{id:'s31',num:31,grp:6,cat:'s36',
 title:"美人计 · The Beauty Plan",
 py:'měi rén jì', en:"The beautiful person plan",
 diff:'medium', rating:1250, em:'🌸', src:'history',
 memo:"Pleasure and flattery can make a leader forget what matters.",
 parts:[
  {h:'Goujian never forgets',
   text:`Long ago, Goujian was the king of Yue. He lost a war to Fuchai, the king of Wu. For years, Goujian had to serve Fuchai.

When he finally went home, he made a promise. He would never forget his defeat. He slept on firewood instead of a soft bed. Every day he tasted something bitter. "Remember this pain," he told himself. People call this idea 卧薪尝胆, sleeping on firewood and tasting bitterness.

In secret, Yue grew stronger and Goujian waited for the right time.`,
   scene:{bg:'day',ground:'grass',items:[{e:'🤴',x:120,y:150,s:62},{e:'🪵',x:215,y:165,s:34},{e:'🌿',x:260,y:160,s:28},{e:'🏯',x:330,y:105,s:52}]},
   cap:'Goujian sleeps on firewood to remember his defeat'},
  {h:'Xi Shi goes to Wu',
   text:`Goujian needed a plan. He sent Xi Shi to Fuchai's court. Xi Shi was a kind and clever young woman from Yue. She loved her homeland, so she agreed to serve it.

Fuchai enjoyed her company. He held many parties and spent a lot of money. He stopped listening to his wise advisers, and he forgot his duties as a king.

Meanwhile, Yue grew stronger every year. At last, Yue's army defeated Wu. A leader who loves pleasure and flattery more than his work can lose everything. That is why people call this the Beauty Plan.`,

{id:'s32',num:32,grp:6,cat:'s36',
 title:"空城计 · The Empty City",
 py:'kōng chéng jì', en:"The empty city plan",
 diff:'easy', rating:950, em:'🏯', src:'novel',
 memo:"Acting calm can make a strong enemy afraid.",
 parts:[
  {h:'Zhuge Liang plays the qin',
   text:`This story is from the famous novel Romance of the Three Kingdoms. Zhuge Liang, a very clever leader, was in a small city. Most of his soldiers were far away. Only a few helpers stayed with him.

Suddenly, a huge army marched toward the city. It was led by Sima Yi. Everyone was afraid. But Zhuge Liang stayed calm. He ordered the city gates to be opened wide. Then he sat on the gate tower in plain clothes and played a qin, a Chinese string instrument. Soft music floated down.

Sima Yi stopped and stared. "Why is Zhuge Liang so calm?" he wondered. "Why are the gates open? There must be soldiers hiding inside!" He knew Zhuge Liang was very clever, so he thought it was an ambush. He turned his army around and left.

The city was safe without a single battle. Zhuge Liang used the enemy's fear and doubt as his weapon.`,

   text:`Duke Wen of Jin once made a promise to the leader of Chu. "If our armies meet in battle, I will pull back three she," he said. Three she was about ninety li. That is roughly thirty miles!

Years later, the two armies faced each other. Duke Wen kept his promise. His army marched back. The commander of Chu felt proud. "They are afraid of us!" he said. He ordered his soldiers to follow.

{id:'sw1',title:'Streamline: Be a Torpedo',cat:'swim',diff:'easy',rating:950,em:'🚀',
passage:`The fastest position in swimming is called the streamline. When you push off the wall in a streamline, you slide through the water like a torpedo.

Here is how to make a great streamline. Put your arms straight over your head. Stack one hand on top of the other and squeeze your arms tight against your ears. Look down at the bottom of the pool, not forward. Squeeze your tummy muscles, keep your legs together, and point your toes.

Why does it matter? Water pushes back on your body, and this push is called drag. A wide, wiggly body makes lots of drag. A long, thin body makes very little. That is why you glide much farther in a tight streamline than with loose arms.

Swimmers use a streamline after every start and every turn. In many races, swimmers are allowed to stay underwater for up to 15 meters after a start or a turn. Fast swimmers use that space to kick hard in their streamline before they come up to swim.

Practice makes it automatic. Push off the wall and count how far you glide. Can you beat your own distance next time?`,

{id:'sw2',title:'Freestyle: Kick, Pull, Breathe',cat:'swim',diff:'medium',rating:1250,em:'🏊',
passage:`Freestyle is the stroke most swimmers use the most. To improve, work on three things: kick, pull, and breathing.

Kick. Your kick should start at your hips, not your knees. Keep your legs fairly straight with floppy, relaxed ankles. Make small, fast kicks that stay just below the surface. A big splash does not mean a fast kick!

Pull. Each arm reaches forward, then "catches" the water. To catch well, bend your elbow so your forearm and hand face the back wall, like you are reaching over a big barrel. Then push the water backward past your hip. Pushing more water back sends you forward.

Breathing. Many young swimmers lift their heads, which makes their legs sink and slows them down. Instead, keep one goggle in the water and turn your head to the side, as if your head is rolling on a pillow. Blow bubbles out through your nose and mouth the whole time your face is in the water, so you can take a quick breath in when you turn.

Later, your coach may teach you to breathe on both sides, every three strokes. This keeps your stroke balanced and helps you see your competitors during a race.

Slow, smooth practice beats fast, messy practice. Fix the technique first, and the speed will come.`,

{id:'sw3',title:'Win the Walls: Starts and Turns',cat:'swim',diff:'medium',rating:1250,em:'🧱',
passage:`In a short race, a lot of time is won or lost at the walls. Great swimmers practice starts and turns just as much as strokes.

The start. Stand with your toes gripping the edge. When the signal sounds, push off and throw your arms forward. Your hands should enter the water first, then your head, body, and feet, all through the same "hole" in the water. This is like diving through a hula hoop. A flat belly flop is slow and can hurt, so keep your body long and tight.

The freestyle flip turn. When you get near the wall, tuck your chin and do a somersault. Your feet land on the wall with your knees bent. Then push off hard. Fast swimmers push off on their backs or sides, rotate to their tummies in the streamline, and start kicking before they surface.

The touch turn. In breaststroke and butterfly, you must touch the wall with both hands at the same time. Then turn quickly and push off.

Tip: count your strokes from the flags to the wall so you always know where it is. This keeps you from taking an extra half stroke or gliding into the wall.

Practice makes turns smooth. Even saving a quarter of a second at each turn adds up over a race.`,

{id:'sw4',title:'Four Strokes, Four Tricks',cat:'swim',diff:'medium',rating:1250,em:'🌊',
passage:`Swim teams use four strokes: freestyle, backstroke, breaststroke, and butterfly. Each one has a key trick.

Backstroke. Lie on your back and keep your head still, like a glass of water is balanced on your forehead. Look up and slightly back. Keep your hips up near the surface and kick steadily from the hips. Arms take turns reaching straight back over your shoulders, pinky finger first.

Breaststroke. This stroke has a special rhythm: pull, breathe, kick, glide. Your hands and feet move at the same time on both sides, never one side before the other. The kick is round, like a frog. Many swimmers get disqualified for a scissor kick, so always keep both feet turning out together.

Butterfly. Butterfly is a wave. Do two kicks for each arm pull: one as your hands enter the water, and one as you push the water back. Press your chest down gently so your hips float up. Breathe forward over the water at the end of the pull, with your chin close to the water.

Individual Medley. In the IM, you swim all four strokes in this order: butterfly, backstroke, breaststroke, freestyle. A swimmer who learns all four strokes well can race in more events.

Master the rhythm of each stroke, and you will keep moving up.`,

{id:'sw5',title:'Practice Like a Champion',cat:'swim',diff:'easy',rating:950,em:'🏅',
passage:`Champions are not just born. They are built at practice. Here are habits that help swimmers move up to the next team.

Show up and listen. Be on time and keep your goggles and cap ready. When your coach explains a drill, watch and listen carefully. Then try it again with the coach's tip in your mind. Swimmers who listen improve faster than swimmers who just swim laps.

Do the drills. Drills like kicking with a board, one-arm freestyle, and streamline push-offs can feel boring, but they fix small mistakes. Small fixes add up to big speed.

Count and track. Use the pace clock to see how long each lap takes. Write down your times in a notebook. When you can see your numbers improve, practice becomes a game against your past self.

Take care of your body. Drink water, eat breakfast, and eat healthy snacks after practice. Kids your age usually need nine to twelve hours of sleep each night. Muscles grow and learn while you sleep.

Be a great teammate. Cheer for others and share lane space politely. Coaches notice effort, attitude, and kindness.

Do these simple things every week, and the Silver and Gold teams will get closer.`,

{id:'sw6',title:'From Bronze to Silver to Gold',cat:'swim',diff:'medium',rating:1250,em:'🥇',
passage:`Many swim clubs, like the Gateway swim team in St. Louis, place swimmers in groups such as Bronze, Silver, and Gold. Each club makes its own rules for moving up, so the best first step is to ask your coach, "What do I need to work on to move up?"

Coaches often look at four things: skills, times, attendance, and attitude. Skills means legal strokes, good turns, and clean starts. Times means your race results compared with the team's time standards. Attendance means going to practice regularly. Attitude means listening, trying hard, and being a good teammate.

Set small goals. A goal like "be Gold next year" is big and far away. Break it into steps: learn a legal flip turn this month, drop two seconds in the 50 freestyle by the next meet, and add a good streamline off every wall.

Know your personal best, or PB. A PB is your own fastest time in an event. At meets, try to beat your PB, not just the swimmer in the next lane. When you do, you earn a happy dance and a new goal.

Race smart. Do not sprint at the start and run out of energy. Swim the first half smoothly and finish strong. Many races are won in the last few strokes.

Stay patient. Every swimmer improves at their own speed. If you work hard, keep learning, and enjoy the water, Silver and Gold will be waiting for you.`,

// ---------- helpers ----------
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function league(m){var l=LEAGUES[0];LEAGUES.forEach(function(x){if(m>=x.min)l=x});return l}
function nextLeague(m){var i=LEAGUES.indexOf(league(m));return LEAGUES[i+1]||null}
function pctTo(m){var l=league(m),n=nextLeague(m);return n?Math.max(0,Math.min(100,Math.round((m-l.min)/(n.min-l.min)*100))):100}

function fmtDate(t){var d=new Date(t);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}

  var pool=STORIES.filter(function(s){return !P.done[s.id]});

  var best=pool.filter(function(s){return Math.abs(s.rating-pool[0].rating)<1});
  return best[Math.floor(Math.random()*best.length)];
}

function nextQ(){if(S.qi+1<S.qs.length){S.qi++;render()}else finish()}

function finish(){
  var st=story(S.sid),n=S.qs.length,c=0,wrong=[];
  S.qs.forEach(function(q,i){if(S.ans[i]===q.a)c++;else wrong.push({q:q.q,a:q.o[q.a]})});
  var d=P.done[st.id]||{n:0,best:0,bestPct:0};
  var K=P.games<PLACEMENT?64:(d.n===0?48:24);
  var s=c/n,E=1/(1+Math.pow(10,(st.rating-P.mmr)/400));
  var delta=Math.round(K*(s-E)),bonus=0;
  if(c===n){P.streak++;if(P.streak>=2){bonus=Math.min(3,P.streak-1)*3;delta+=bonus}}else P.streak=0;
  var before=P.mmr,lb=league(before),wasPlacement=P.games<PLACEMENT;
  P.mmr=Math.max(0,before+delta);delta=P.mmr-before;
  P.games++;P.best=Math.max(P.best,P.mmr);
  d.n++;d.best=Math.max(d.best,c);d.bestPct=Math.max(d.bestPct||0,Math.round(c/n*100));P.done[st.id]=d;
  P.hist.unshift({t:Date.now(),id:st.id,title:st.title,cat:st.cat,c:c,n:n,d:delta,m:P.mmr});
  save();
  var la=league(P.mmr);
  S.res={c:c,n:n,delta:delta,bonus:bonus,before:before,after:P.mmr,lb:lb,la:la,
    promoted:LEAGUES.indexOf(la)>LEAGUES.indexOf(lb),demoted:LEAGUES.indexOf(la)<LEAGUES.indexOf(lb),
    placement:wasPlacement,gamesLeft:Math.max(0,PLACEMENT-P.games),wrong:wrong,streak:P.streak};
  go('result');
}

// ---------- settings / backup ----------
function setName(v){P.name=(v||'Reader').slice(0,20);save()}
function setFs(dx){P.fs=Math.max(17,Math.min(32,P.fs+dx));save();render(true)}
function exportJSON(){return JSON.stringify(P)}
function copyBackup(){
  var t=$('bk');t.focus();t.select();t.setSelectionRange(0,999999);
  var ok=false;try{ok=document.execCommand('copy')}catch(e){}
  if(!ok&&navigator.clipboard){navigator.clipboard.writeText(t.value);ok=true}
  S.msg=ok?'Copied! 已复制':'Select the text and copy it manually';render(true)
}
function downloadBackup(){
  var b=new Blob([exportJSON()],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='star-reading-backup.json';document.body.appendChild(a);a.click();a.remove();
}
function importBackup(){
  try{
    var o=JSON.parse($('imp').value.trim());
    if(typeof o.mmr!=='number'||!Array.isArray(o.hist))throw 0;
    var d=defaults();for(var k in o)d[k]=o[k];P=d;save();S.msg='Loaded! 导入成功';
  }catch(e){S.msg='That does not look like a backup. 备份格式不对'}
  render(true)
}
function resetAll(){
  if(!S.armed){S.armed=true;render(true);return}
  P=defaults();save();go('home');
}

function quizScreen(){

function spark(){
  var pts=[800].concat(P.hist.slice(0,40).map(function(x){return x.m}).reverse());
  if(pts.length<2)return '';
  var mn=Math.min.apply(null,pts)-20,mx=Math.max.apply(null,pts)+20,W=300,H=80;
  var d=pts.map(function(v,i){return (i/(pts.length-1)*W).toFixed(1)+','+(H-(v-mn)/(mx-mn)*H).toFixed(1)}).join(' ');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:90px"><polyline fill="none" stroke="#4f8cff" stroke-width="3" stroke-linejoin="round" points="'+d+'"/></svg>';
}

  h+='<div class="card"><h3 style="margin-bottom:6px">💾 Backup · 备份</h3><div class="sub" style="margin-bottom:8px">Progress lives in this browser. Save a backup now and then (Notes, Google Drive, email) so it is never lost.</div>'+
     '<textarea id="bk" readonly>'+esc(exportJSON())+'</textarea>'+
     '<div class="row" style="margin-top:10px"><button class="big-btn sec" onclick="copyBackup()">📋 Copy</button><button class="big-btn sec" onclick="downloadBackup()">⬇️ Download</button></div></div>';
  h+='<div class="card"><h3 style="margin-bottom:6px">📥 Restore · 导入备份</h3><textarea id="imp" placeholder="Paste backup here"></textarea>'+
     '<button class="big-btn sec" style="margin-top:10px" onclick="importBackup()">Load backup</button></div>';
  h+='<div class="card"><h3 style="margin-bottom:8px">🗑 Reset ladder · 重置</h3><button class="big-btn" style="background:#b91c1c" onclick="resetAll()">'+(S.armed?'Tap again to erase everything 再点一次确认':'Reset all progress')+'</button></div>';
  h+='<div class="sub center" style="margin-top:14px">Reading level is a fun estimate, not an official STAR Reading score.</div>';
  return h;
}

var lastScreen='';
function render(keep){
  var f={home:homeScreen,cat:catScreen,read:readScreen,quiz:quizScreen,result:resultScreen,history:historyScreen,settings:settingsScreen}[S.screen]||homeScreen;
  var pl=$('pl'),pr=$('pr'),sl=pl?pl.scrollTop:0,sr=pr?pr.scrollTop:0,wasQuiz=lastScreen==='quiz';
  $('app').className=S.screen==='quiz'?'wide':'';
  $('app').innerHTML=f();
  if(S.screen==='quiz'&&wasQuiz){
    if($('pl'))$('pl').scrollTop=sl;
    if(keep&&$('pr'))$('pr').scrollTop=sr;
  }else if(!keep)window.scrollTo(0,0);
  lastScreen=S.screen;
}
render();
</script>
</body>
</html>
