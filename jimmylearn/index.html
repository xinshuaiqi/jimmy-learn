<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JimmyLearn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #F0F4FF;
  --bg-card: #FFFFFF;
  --bg-surface: #E8EEFB;
  --bg-surface2: #DDE5F8;
  --text-1: #111827;
  --text-2: #374151;
  --text-3: #6B7280;
  --text-4: #9CA3AF;
  --border: #DDE3F0;
  --shadow-sm: 0 1px 4px rgba(60,70,120,0.08);
  --shadow: 0 3px 14px rgba(60,70,120,0.10);
  --shadow-lg: 0 8px 32px rgba(60,70,120,0.14);
  --accent: #5B4FE8;
  --accent-warm: #F97316;
  --radius: 18px;
  --radius-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1117;
    --bg-card: #141B2D;
    --bg-surface: #1C2438;
    --bg-surface2: #222C42;
    --text-1: #F1F5FF;
    --text-2: #C8D3F0;
    --text-3: #8899BB;
    --text-4: #556080;
    --border: #253050;
    --shadow-sm: 0 1px 4px rgba(0,0,0,0.4);
    --shadow: 0 3px 14px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"] {
  --bg: #0D1117;
  --bg-card: #141B2D;
  --bg-surface: #1C2438;
  --bg-surface2: #222C42;
  --text-1: #F1F5FF;
  --text-2: #C8D3F0;
  --text-3: #8899BB;
  --text-4: #556080;
  --border: #253050;
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.4);
  --shadow: 0 3px 14px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text-1);font-family:'Inter',system-ui,sans-serif;min-height:100vh;transition:background .25s}
h1,h2,h3,h4,.display{font-family:'Nunito',sans-serif}
button{cursor:pointer;border:none;background:none;font-family:inherit}
a{color:inherit;text-decoration:none}
img{max-width:100%}

/* ── APP SHELL ── */
#app{min-height:100vh;display:flex;flex-direction:column}

/* ── TOP NAV ── */
.nav{background:var(--bg-card);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.nav-brand{display:flex;align-items:center;gap:8px;font-family:'Nunito',sans-serif;font-weight:900;font-size:1.25rem;color:var(--accent)}
.nav-brand span.emoji{font-size:1.4rem}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:.82rem;font-weight:600;font-family:'Nunito',sans-serif;transition:all .15s;border:2px solid transparent}
.nav-btn.outline{border-color:var(--border);color:var(--text-2);background:var(--bg-surface)}
.nav-btn.outline:hover{border-color:var(--accent);color:var(--accent)}
.nav-btn.primary{background:var(--accent);color:#fff}
.nav-btn.primary:hover{opacity:.88}

/* ── SCREENS ── */
.screen{display:none;flex:1;padding:32px 20px 64px;max-width:900px;margin:0 auto;width:100%}
.screen.active{display:block}

/* ── WELCOME SCREEN ── */
.welcome-hero{text-align:center;padding:48px 0 36px}
.welcome-hero h1{font-size:2.8rem;font-weight:900;line-height:1.1;text-wrap:balance;margin-bottom:10px}
.welcome-hero h1 .hi{color:var(--accent-warm)}
.welcome-hero p{color:var(--text-3);font-size:1.05rem;margin-bottom:8px}
.topic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:32px}
@media(max-width:600px){.topic-grid{grid-template-columns:repeat(2,1fr)}}
.topic-card{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);padding:20px 16px;text-align:center;cursor:pointer;transition:all .18s;box-shadow:var(--shadow-sm)}
.topic-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--tc)}
.topic-card .tc-emoji{font-size:2.4rem;display:block;margin-bottom:8px}
.topic-card .tc-name{font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;color:var(--text-1);margin-bottom:4px}
.topic-card .tc-tag{font-size:.77rem;color:var(--text-3)}
.topic-card.selected{border-color:var(--tc);background:var(--tc-muted)}
.topic-card.selected .tc-name{color:var(--tc)}

/* ── PLAN SCREEN ── */
.plan-header{display:flex;align-items:center;gap:14px;margin-bottom:28px;padding:22px 24px;background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.plan-header .topic-badge{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0}
.plan-header h2{font-size:1.5rem;font-weight:900;margin-bottom:2px}
.plan-header p{color:var(--text-3);font-size:.9rem}
.week-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
@media(max-width:580px){.week-grid{grid-template-columns:repeat(2,1fr)}}
.day-card{background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius-sm);padding:16px;cursor:pointer;transition:all .16s;box-shadow:var(--shadow-sm)}
.day-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--tc)}
.day-card .dc-day{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-bottom:6px}
.day-card .dc-emoji{font-size:1.6rem;display:block;margin-bottom:6px}
.day-card .dc-title{font-family:'Nunito',sans-serif;font-weight:800;font-size:.92rem;color:var(--text-1);line-height:1.3;margin-bottom:4px}
.day-card .dc-type{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:6px;display:inline-block}
.plan-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.plan-actions button{flex:1;min-width:130px;padding:13px 16px;border-radius:12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;border:2px solid transparent}
.btn-books{background:var(--bg-surface);color:var(--text-2);border-color:var(--border)}
.btn-books:hover{border-color:var(--tc);color:var(--tc)}
.btn-download{background:var(--bg-surface);color:var(--text-2);border-color:var(--border)}
.btn-download:hover{border-color:#22C55E;color:#16A34A}
.btn-quiz{background:var(--accent-warm);color:#fff}
.btn-quiz:hover{opacity:.88}
.btn-back{background:var(--bg-surface);color:var(--text-2);border-color:var(--border)}
.btn-back:hover{border-color:var(--accent);color:var(--accent)}

/* ── DAY SCREEN ── */
.day-nav{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.day-badge{padding:5px 14px;border-radius:20px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;color:#fff}
.day-title{font-size:1.7rem;font-weight:900;margin-bottom:6px;text-wrap:balance}
.day-subtitle{color:var(--text-3);font-size:.9rem;margin-bottom:24px}
.content-section{background:var(--bg-card);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.content-section h3{font-family:'Nunito',sans-serif;font-weight:800;font-size:1.05rem;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.passage{font-size:1.02rem;line-height:1.78;color:var(--text-2)}
.passage p{margin-bottom:1em}
.passage p:last-child{margin-bottom:0}
.vocab-list{display:flex;flex-direction:column;gap:10px}
.vocab-item{padding:12px 14px;background:var(--bg-surface);border-radius:10px;border-left:3px solid var(--tc,var(--accent))}
.vocab-word{font-family:'Nunito',sans-serif;font-weight:800;font-size:.95rem;color:var(--tc,var(--accent));margin-bottom:2px}
.vocab-def{font-size:.87rem;color:var(--text-2);line-height:1.5}
.questions-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.questions-list li{padding:12px 14px;background:var(--bg-surface);border-radius:10px;font-size:.92rem;color:var(--text-2);line-height:1.5;display:flex;gap:10px}
.questions-list li::before{content:attr(data-n);font-family:'Nunito',sans-serif;font-weight:900;font-size:.85rem;color:var(--tc,var(--accent));flex-shrink:0;width:22px;height:22px;background:var(--tc-muted,var(--bg-surface2));border-radius:6px;display:flex;align-items:center;justify-content:center}
.materials-list,.steps-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.materials-list li{padding:8px 12px;background:var(--bg-surface);border-radius:8px;font-size:.9rem;color:var(--text-2);display:flex;align-items:center;gap:8px}
.materials-list li::before{content:'•';color:var(--tc,var(--accent));font-size:1.2rem;line-height:1}
.steps-list li{padding:10px 14px;background:var(--bg-surface);border-radius:10px;font-size:.9rem;color:var(--text-2);line-height:1.5;display:flex;gap:12px}
.step-num{font-family:'Nunito',sans-serif;font-weight:900;font-size:.85rem;color:#fff;background:var(--tc,var(--accent));width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.wonder-box{margin-top:14px;padding:14px;background:var(--tc-muted,var(--bg-surface2));border-radius:12px;border:1.5px dashed var(--tc,var(--accent));font-size:.9rem;color:var(--text-2);line-height:1.55}
.wonder-box strong{color:var(--tc,var(--accent));font-family:'Nunito',sans-serif}
.writing-prompts{display:flex;flex-direction:column;gap:12px}
.writing-prompt-card{padding:16px;background:var(--bg-surface);border-radius:12px;border:2px solid var(--border);cursor:pointer;transition:border-color .15s}
.writing-prompt-card:hover,.writing-prompt-card.selected{border-color:var(--tc,var(--accent));background:var(--tc-muted)}
.writing-prompt-card .wp-num{font-family:'Nunito',sans-serif;font-weight:900;font-size:.77rem;color:var(--tc,var(--accent));text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.writing-prompt-card .wp-text{font-size:.92rem;color:var(--text-2);line-height:1.55}
.mindmap-center{text-align:center;padding:18px;margin-bottom:16px}
.mindmap-bubble{display:inline-block;padding:12px 24px;background:var(--tc,var(--accent));color:#fff;border-radius:40px;font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem}
.mindmap-nodes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.mindmap-node{padding:7px 14px;background:var(--tc-muted);border:2px solid var(--tc,var(--accent));border-radius:20px;font-family:'Nunito',sans-serif;font-weight:700;font-size:.85rem;color:var(--tc,var(--accent))}
.tip-box{padding:12px 16px;background:var(--bg-surface);border-radius:10px;font-size:.88rem;color:var(--text-3);line-height:1.5}
.book-reading-card{display:flex;gap:16px;align-items:flex-start}
.book-spine{width:60px;height:90px;border-radius:4px 10px 10px 4px;background:var(--tc,var(--accent));display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0}
.book-info h4{font-family:'Nunito',sans-serif;font-weight:900;font-size:1rem;margin-bottom:2px}
.book-info .book-author{font-size:.82rem;color:var(--text-3);margin-bottom:8px}
.book-info .book-read{font-size:.9rem;color:var(--text-2);line-height:1.5}
.disc-questions{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:14px}
.disc-questions li{font-size:.9rem;color:var(--text-2);padding:10px 14px;background:var(--bg-surface);border-radius:9px;line-height:1.5;display:flex;align-items:flex-start;gap:8px}
.disc-questions li::before{content:'💬';font-size:.9rem;flex-shrink:0;margin-top:1px}

/* ── BOOKS SCREEN ── */
.books-header{text-align:center;margin-bottom:28px}
.books-header h2{font-size:1.8rem;font-weight:900;margin-bottom:6px}
.books-header p{color:var(--text-3)}
.book-cards{display:flex;flex-direction:column;gap:16px}
.book-card{background:var(--bg-card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm);display:flex;gap:18px;align-items:flex-start;border:1.5px solid var(--border)}
.book-card-spine{width:72px;height:104px;border-radius:5px 12px 12px 5px;display:flex;align-items:center;justify-content:center;font-size:2.4rem;flex-shrink:0;box-shadow:3px 3px 10px rgba(0,0,0,.15)}
.book-card-body{flex:1}
.book-card-body h3{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.05rem;margin-bottom:2px;line-height:1.3}
.book-card-body .author{font-size:.82rem;color:var(--text-3);margin-bottom:8px}
.book-card-body .age-badge{display:inline-block;padding:2px 10px;border-radius:8px;font-size:.75rem;font-weight:700;font-family:'Nunito',sans-serif;margin-bottom:8px}
.book-card-body .why{font-size:.88rem;color:var(--text-2);line-height:1.6}

/* ── QUIZ SCREEN ── */
.quiz-header{text-align:center;margin-bottom:32px}
.quiz-header h2{font-size:1.8rem;font-weight:900;margin-bottom:6px}
.quiz-progress{display:flex;gap:6px;justify-content:center;margin-bottom:28px}
.quiz-pip{width:32px;height:8px;border-radius:4px;background:var(--border);transition:background .2s}
.quiz-pip.active{background:var(--tc,var(--accent))}
.quiz-pip.done{background:var(--tc,var(--accent));opacity:.45}
.quiz-card{background:var(--bg-card);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);margin-bottom:20px}
.quiz-q{font-family:'Nunito',sans-serif;font-weight:800;font-size:1.15rem;line-height:1.45;margin-bottom:22px;text-wrap:balance}
.quiz-options{display:flex;flex-direction:column;gap:10px}
.quiz-option{padding:14px 18px;border-radius:12px;border:2px solid var(--border);background:var(--bg-surface);font-size:.95rem;color:var(--text-2);text-align:left;transition:all .14s;cursor:pointer;font-family:'Inter',sans-serif;line-height:1.4}
.quiz-option:hover:not(:disabled){border-color:var(--tc,var(--accent));background:var(--tc-muted)}
.quiz-option.correct{border-color:#22C55E!important;background:rgba(34,197,94,.12)!important;color:#166534}
.quiz-option.wrong{border-color:#EF4444!important;background:rgba(239,68,68,.1)!important;color:#991B1B}
.quiz-option:disabled{cursor:default}
.quiz-explain{margin-top:14px;padding:12px 14px;background:var(--bg-surface);border-radius:10px;font-size:.88rem;color:var(--text-2);line-height:1.55;border-left:3px solid #22C55E}
.quiz-next-btn{display:block;width:100%;margin-top:16px;padding:14px;background:var(--tc,var(--accent));color:#fff;border-radius:12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;text-align:center;transition:opacity .15s}
.quiz-next-btn:hover{opacity:.88}
.quiz-result{text-align:center;padding:40px 20px}
.quiz-result .score-ring{width:110px;height:110px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 18px;background:var(--tc-muted)}
.quiz-result .score-num{font-family:'Nunito',sans-serif;font-weight:900;font-size:2.2rem;line-height:1;color:var(--tc,var(--accent))}
.quiz-result .score-label{font-size:.72rem;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.quiz-result h3{font-size:1.5rem;font-weight:900;margin-bottom:8px}
.quiz-result p{color:var(--text-3);margin-bottom:24px}
.quiz-result .btn-try{padding:13px 28px;background:var(--tc,var(--accent));color:#fff;border-radius:12px;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;cursor:pointer;transition:opacity .15s;border:none}
.quiz-result .btn-try:hover{opacity:.88}

/* ── UTILS ── */
.back-row{display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:.78rem;font-weight:700;font-family:'Nunito',sans-serif}
.section-label{font-size:.73rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);margin-bottom:10px}
.day-nav-row{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap}
.day-nav-row button{flex:1;min-width:120px;padding:12px;border-radius:10px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.88rem;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.btn-prev{background:var(--bg-surface);color:var(--text-2);border:2px solid var(--border)}
.btn-next{background:var(--tc,var(--accent));color:#fff;border:none}
.btn-next:hover,.btn-prev:hover{opacity:.85}

@media (prefers-reduced-motion: reduce) {
  *{transition:none!important;animation:none!important}
}
@media(max-width:480px){
  .plan-actions{flex-direction:column}
  .book-card{flex-direction:column}
  .book-card-spine{width:100%;height:80px;border-radius:12px}
}
</style>
</head>
<body>
<div id="app">
  <nav class="nav">
    <div class="nav-brand"><span class="emoji">🎒</span> JimmyLearn</div>
    <div class="nav-right">
      <button class="nav-btn outline" onclick="goHome()" id="nav-home" style="display:none">← Home</button>
    </div>
  </nav>
  <div id="screen-welcome" class="screen active"></div>
  <div id="screen-plan"    class="screen"></div>
  <div id="screen-day"     class="screen"></div>
  <div id="screen-books"   class="screen"></div>
  <div id="screen-quiz"    class="screen"></div>
</div>

<script>
/* ─────────────────────────────────────────────
   CONTENT DATA
───────────────────────────────────────────── */
const TOPICS = {
space: {
  id:'space', name:'Space & Planets', emoji:'🚀',
  tagline:'Blast off into the cosmos!',
  color:'#6366F1', colorMuted:'rgba(99,102,241,0.13)',
  days:{
    mon:{day:'Monday',emoji:'📖',type:'Reading',typeColor:'#6366F1',
      title:'The Red Planet Calls',
      passage:`<p>Every night, if you look up at the sky, you might spot a tiny reddish dot — one that doesn't twinkle like the stars around it. That's Mars, our Solar System's most famous neighbor!</p>
<p>Mars is called the "Red Planet" because its entire surface is covered in iron oxide — which is basically rust. Imagine a whole world painted in orange-red dust, with swirling dust storms that can cover the entire planet for months at a time!</p>
<p>Scientists have sent robotic explorers called rovers to investigate. In February 2021, NASA's Perseverance rover made a perfect landing in an ancient lake bed called Jezero Crater. Its mission: hunt for signs that tiny life forms might have existed billions of years ago. Perseverance also carried a small helicopter named Ingenuity, which made history by becoming the first aircraft ever to fly on another planet!</p>
<p>Mars holds some truly record-breaking landmarks. Olympus Mons is the tallest volcano in the entire Solar System — three times taller than Mount Everest! And Valles Marineris is a canyon system so wide it would stretch across the entire United States.</p>
<p>Here's the most exciting part: Mars has frozen water at its poles. The first human to set foot on Mars is probably alive right now — possibly about your age. Could it be you?</p>`,
      vocab:[
        {word:'iron oxide',def:'A reddish-brown substance made from iron and oxygen — basically rust! It gives Mars its famous color.'},
        {word:'rover',def:'A robot vehicle designed to move across and explore the surface of another planet.'},
        {word:'atmosphere',def:'The layer of gases surrounding a planet. Earth\'s atmosphere gives us air to breathe.'},
        {word:'crater',def:'A bowl-shaped depression on the surface of a planet or moon, often made by a meteor impact.'},
        {word:'orbit',def:'To travel in a circular or oval path around something, like Earth orbits the Sun each year.'},
        {word:'mission',def:'An important journey or project with a specific purpose or goal.'}
      ],
      questions:[
        'Why is Mars called the "Red Planet"? What is iron oxide?',
        'What is Perseverance, and what first did the helicopter Ingenuity achieve?',
        'Compare Olympus Mons to something on Earth. How does that help you picture its size?',
        'If you could send a rover to any place in the Solar System, where would you send it and what three things would you want it to discover?'
      ]
    },
    tue:{day:'Tuesday',emoji:'🧠',type:'Mind Map',typeColor:'#8B5CF6',
      title:'Map the Solar System',
      center:'Solar System',
      nodes:['8 Planets','The Sun','Asteroids & Comets','Moons','Dwarf Planets','Space Missions'],
      tip:'On paper, write "Solar System" in the middle and draw a branch for each node above. Under each branch, add at least 2 facts you already know — then look up one more surprising fact to add!',
      challenge:'⭐ Challenge: Can you add one weird or funny fact to each branch?'
    },
    wed:{day:'Wednesday',emoji:'🔬',type:'Experiment',typeColor:'#0EA5E9',
      title:'Make a Crater!',
      intro:'When meteors crash into planets, they create craters. Let\'s recreate that in your kitchen!',
      materials:['A deep tray or cardboard box','Flour (2–3 cups)','Cocoa powder (a few tablespoons)','Marbles or small rocks of different sizes','A ruler'],
      steps:[
        'Pour flour about 5 cm deep into the tray.',

<p>Wolves live in family groups called packs, typically 5 to 10 members strong. Each pack is led by a bonded pair of parents who make decisions for the whole group. Wolf pups are born tiny and helpless, but within a year, they're learning to hunt alongside the adults. Wolves communicate using an entire language of howls, whimpers, growls, and body positions — a long, mournful howl can carry five miles across the wilderness!</p>
<p>Here's a story that will change how you see wolves forever. In 1995, scientists reintroduced gray wolves to Yellowstone National Park in Wyoming, where they had been absent for 70 years. The wolves began hunting elk and deer. Those animals started avoiding open riverbeds where they'd graze. Without constant grazing, riverside plants grew tall and thick. Beavers returned to build dams. Birds nested in the new trees. The rivers themselves began to flow differently because plant roots held the riverbanks in place.</p>
<p>One species of animal changed an entire national park. Scientists call this extraordinary chain reaction a <em>trophic cascade</em> — when the return of one predator transforms a whole ecosystem.</p>
<p>Wolves don't just belong in the wild. They make the wild possible.</p>`,

      passage:`<p>What separates a good team from an extraordinary one? Is it raw talent? The best training equipment? Or something much harder to measure?</p>
<p>In the 2004 Summer Olympics, the United States men's basketball team arrived in Athens, Greece with some of the biggest names in the sport — future Hall of Famers, multi-million-dollar athletes. On paper, they were unbeatable. But they lost three games and walked away with just a bronze medal.</p>
<p>Meanwhile, Argentina — a team with no single superstar — won the gold medal. How? The Argentine players had trained together for five years. They knew each other's habits, fears, and strengths. They moved like one organism, not five separate egos.</p>
<p>Sports scientists have discovered something remarkable: in almost every team sport, the players who communicate most are the ones whose teams win more games. Not the fastest, not the strongest — the most communicative. Great teams develop what researchers call "team chemistry": an invisible bond built from making eye contact, giving encouragement after mistakes, and sharing credit for success.</p>
<p>Think about the greatest relay race you've ever watched. It isn't the fastest individual runner who wins — it's the team that executes the baton pass perfectly. That split-second handoff, practiced a thousand times in training, is where championships are made.</p>

      title:'Why Is the Sky Blue?',
      passage:`<p>Here's a question scientists puzzled over for centuries: why is the sky blue? It seems obvious once you're outside — but the real answer is one of the most beautiful discoveries in all of physics.</p>
<p>Sunlight looks white, but it's actually a mixture of every color in the rainbow, all blended together. When sunlight enters Earth's atmosphere, it crashes into billions of tiny gas molecules — mostly nitrogen and oxygen. Here's the key: blue light has a shorter wavelength than red or orange light, which means it bounces off those molecules much more easily, scattering in all directions at once. When you look up at any part of the sky, you're seeing scattered blue light arriving from every angle.</p>
<p>But at sunset, the Sun sits at a very low angle on the horizon. Its light must travel through a much thicker slice of atmosphere to reach your eyes. By the time it arrives, almost all the blue light has already scattered away overhead. What remains? The longer wavelengths — deep reds, warm oranges, brilliant golds. That's why sunsets are so dramatic.</p>
<p>This same principle — called Rayleigh scattering — explains dozens of everyday mysteries: why milk is white (light scatters off fat droplets), why snow is white (light scatters off ice crystals), and why the deep sea looks so eerily blue even when there's no sky above it.</p>
<p>Science is everywhere. You just have to know how to look.</p>`,

/* ─────────────────────────────────────────────
   APP STATE
───────────────────────────────────────────── */
const S = {
  screen: 'welcome',
  topic: null,
  day: null,
  quizIdx: 0,
  quizScore: 0,
  quizDone: false,
  quizAnswered: false
};

const DAY_ORDER = ['mon','tue','wed','thu','fri','weekend'];

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.getElementById('nav-home').style.display = name === 'welcome' ? 'none' : 'flex';
  S.screen = name;
  window.scrollTo(0, 0);
}

function setTopicVars(t) {
  const root = document.documentElement;
  root.style.setProperty('--tc', t.color);
  root.style.setProperty('--tc-muted', t.colorMuted);
}

/* ─────────────────────────────────────────────
   WELCOME SCREEN
───────────────────────────────────────────── */
function renderWelcome() {
  const el = document.getElementById('screen-welcome');
  const cards = Object.values(TOPICS).map(t => `
    <button class="topic-card" style="--tc:${t.color};--tc-muted:${t.colorMuted}" onclick="selectTopic('${t.id}')">
      <span class="tc-emoji">${t.emoji}</span>
      <div class="tc-name">${t.name}</div>
      <div class="tc-tag">${t.tagline}</div>
    </button>`).join('');

  el.innerHTML = `
    <div class="welcome-hero">
      <h1><span class="hi">Hi Jimmy!</span> 👋<br>What do you want to<br>explore this week?</h1>
      <p>Pick a topic and I'll build your whole week of learning!</p>
    </div>
    <div class="topic-grid">${cards}</div>`;
}

/* ─────────────────────────────────────────────
   PLAN SCREEN
───────────────────────────────────────────── */
function selectTopic(id) {
  S.topic = id;
  S.quizIdx = 0; S.quizScore = 0; S.quizDone = false;
  setTopicVars(TOPICS[id]);
  renderPlan();
  showScreen('plan');
}

const TYPE_COLORS = {
  'Reading':'#6366F1','Mind Map':'#8B5CF6','Experiment':'#0EA5E9',
  'Creative Writing':'#F97316','Book Reading':'#16A34A','Quiz':'#F59E0B'
};

function renderPlan() {
  const t = TOPICS[S.topic];
  const dayCards = DAY_ORDER.map(dk => {
    const d = t.days[dk];
    const tc = TYPE_COLORS[d.type] || t.color;
    return `<button class="day-card" onclick="openDay('${dk}')">
      <div class="dc-day">${d.day}</div>
      <span class="dc-emoji">${d.emoji}</span>
      <div class="dc-title">${d.title}</div>
      <span class="dc-type" style="background:${tc}22;color:${tc}">${d.type}</span>
    </button>`;
  }).join('');

  document.getElementById('screen-plan').innerHTML = `
    <div class="plan-header">
      <div class="topic-badge" style="background:${t.colorMuted}">${t.emoji}</div>
      <div>
        <h2>${t.name}</h2>
        <p>Your adventure for the week is ready! Click any day to begin.</p>
      </div>
    </div>
    <div class="week-grid">${dayCards}</div>
    <div class="plan-actions">
      <button class="plan-actions btn-books" onclick="showBooks()">📚 Book List</button>
      <button class="plan-actions btn-quiz" onclick="showQuiz()">🏆 Take the Quiz</button>
      <button class="plan-actions btn-download" onclick="downloadMd()">⬇ Download Week</button>
      <button class="plan-actions btn-back" onclick="goHome()">← Change Topic</button>
    </div>`;
}

/* ─────────────────────────────────────────────
   DAY SCREEN
───────────────────────────────────────────── */
function openDay(dayKey) {
  S.day = dayKey;
  renderDay(dayKey);
  showScreen('day');
}

function renderDay(dk) {
  const t = TOPICS[S.topic];
  const d = t.days[dk];
  const idx = DAY_ORDER.indexOf(dk);
  const prevDk = idx > 0 ? DAY_ORDER[idx-1] : null;
  const nextDk = idx < DAY_ORDER.length - 1 ? DAY_ORDER[idx+1] : null;

  let body = '';
  if (d.type === 'Reading') body = renderReading(d, t);
  else if (d.type === 'Mind Map') body = renderMindmap(d, t);
  else if (d.type === 'Experiment') body = renderExperiment(d, t);
  else if (d.type === 'Creative Writing') body = renderWriting(d, t);
  else if (d.type === 'Book Reading') body = renderBookDay(d, t);
  else if (d.type === 'Quiz') { showQuiz(); return; }

  const navBtns = `<div class="day-nav-row">
    <button class="btn-prev" onclick="goBackToPlan()">← Back to Week</button>
    ${prevDk ? `<button class="btn-prev" onclick="openDay('${prevDk}')">← ${t.days[prevDk].day}</button>` : ''}
    ${nextDk ? `<button class="btn-next" onclick="openDay('${nextDk}')">${t.days[nextDk].day} →</button>` : ''}
  </div>`;

  const tc = TYPE_COLORS[d.type] || t.color;
  document.getElementById('screen-day').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap">
      <span class="day-badge" style="background:${tc}">${d.day}</span>
      <span style="font-size:.82rem;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em">${d.type}</span>
    </div>
    <h1 class="day-title">${d.emoji} ${d.title}</h1>
    ${body}
    ${navBtns}`;
}

function renderReading(d, t) {
  const vocabHtml = d.vocab.map(v => `
    <div class="vocab-item">
      <div class="vocab-word">${v.word}</div>
      <div class="vocab-def">${v.def}</div>
    </div>`).join('');

  const qHtml = d.questions.map((q,i) => `
    <li data-n="${i+1}">${q}</li>`).join('');

  return `
    <div class="content-section">
      <h3>📖 Reading Passage</h3>
      <div class="passage">${d.passage}</div>
    </div>
    <div class="content-section">
      <h3 style="color:${t.color}">📝 Vocabulary Words</h3>
      <div class="vocab-list">${vocabHtml}</div>
    </div>
    <div class="content-section">
      <h3>💭 Questions to Think About</h3>
      <ul class="questions-list">${qHtml}</ul>
    </div>`;
}

function renderMindmap(d, t) {
  const nodes = d.nodes.map(n => `<span class="mindmap-node">${n}</span>`).join('');
  return `
    <div class="content-section">
      <h3>🧠 Your Mind Map Activity</h3>
      <div class="mindmap-center"><span class="mindmap-bubble">${d.center}</span></div>
      <p style="text-align:center;color:var(--text-3);font-size:.85rem;margin-bottom:12px">Draw branches for these topics:</p>
      <div class="mindmap-nodes">${nodes}</div>
      <div class="tip-box"><strong>How to do it:</strong> ${d.tip}</div>
    </div>
    <div class="content-section">
      <div class="wonder-box"><strong>⭐ Challenge:</strong> ${d.challenge}</div>
    </div>`;
}

function renderExperiment(d, t) {
  const mats = d.materials.map(m => `<li>${m}</li>`).join('');
  const steps = d.steps.map((s,i) => `<li><span class="step-num">${i+1}</span>${s}</li>`).join('');
  return `
    <div class="content-section">
      <h3>🔬 The Experiment</h3>
      <p style="color:var(--text-2);font-size:.95rem;line-height:1.6;margin-bottom:16px">${d.intro}</p>
      <h3 style="margin-bottom:10px">📦 What You'll Need</h3>
      <ul class="materials-list">${mats}</ul>
    </div>
    <div class="content-section">
      <h3>🚀 Steps</h3>
      <ul class="steps-list">${steps}</ul>
    </div>
    <div class="wonder-box">${d.wonder}</div>`;
}

function renderWriting(d, t) {
  const prompts = d.prompts.map(p => `
    <div class="writing-prompt-card">
      <div class="wp-num">${p.num}</div>
      <div class="wp-text">${p.text}</div>
    </div>`).join('');
  return `
    <div class="content-section">
      <h3>✍️ Your Writing Mission</h3>
      <p style="color:var(--text-3);font-size:.88rem;margin-bottom:16px">${d.intro}</p>
      <div class="writing-prompts">${prompts}</div>
    </div>
    <div class="tip-box" style="margin-top:4px">
      💡 <strong>Tip:</strong> Before you write, spend 3 minutes just thinking. Jot down 3–5 words or ideas. Then start your first sentence with something exciting — not "I am going to write about..."
    </div>`;
}

function renderBookDay(d, t) {
  const qHtml = d.questions.map(q => `<li>${q}</li>`).join('');
  return `
    <div class="content-section">
      <h3>📚 This Week's Book</h3>
      <div class="book-reading-card">
        <div class="book-spine" style="background:${t.color}">${d.bookEmoji}</div>
        <div class="book-info">
          <h4>${d.book}</h4>
          <div class="book-author">${d.author}</div>
          <div class="book-read">${d.readThis}</div>
        </div>
      </div>
      <h3 style="margin-top:20px;margin-bottom:10px">💬 Discussion Questions</h3>
      <ul class="disc-questions">${qHtml}</ul>
    </div>
    <div class="tip-box">
      📖 <strong>Reading tip:</strong> After you finish, close the book and try to summarize what happened in your own words — without looking. This is one of the best ways to remember what you read!
    </div>`;
}

/* ─────────────────────────────────────────────
   BOOKS SCREEN
───────────────────────────────────────────── */
function showBooks() {
  const t = TOPICS[S.topic];
  const cards = t.books.map((b,i) => `
    <div class="book-card">
      <div class="book-card-spine" style="background:${b.color}">${b.emoji}</div>
      <div class="book-card-body">
        <h3>${b.title}</h3>
        <div class="author">${b.author}</div>
        <span class="age-badge" style="background:${b.color}20;color:${b.color}">📅 ${b.ages}</span>
        <div class="why">${b.why}</div>
      </div>
    </div>`).join('');

  document.getElementById('screen-books').innerHTML = `
    <div class="back-row">
      <button class="nav-btn outline" onclick="goBackToPlan()">← Back to Week</button>
    </div>
    <div class="books-header">
      <h2>📚 This Week's Book Recommendations</h2>
      <p>Three great books to go along with your <strong>${t.name}</strong> theme this week.</p>
    </div>
    <div class="book-cards">${cards}</div>`;
  showScreen('books');
}

/* ─────────────────────────────────────────────
   QUIZ SCREEN
───────────────────────────────────────────── */
function showQuiz() {
  S.quizIdx = 0; S.quizScore = 0; S.quizDone = false; S.quizAnswered = false;
  renderQuiz();
  showScreen('quiz');
}

function renderQuiz() {
  const t = TOPICS[S.topic];
  if (S.quizDone) { renderQuizResult(); return; }

  const q = t.quiz[S.quizIdx];
  const pips = t.quiz.map((_,i) =>
    `<div class="quiz-pip ${i < S.quizIdx ? 'done' : i === S.quizIdx ? 'active' : ''}"></div>`
  ).join('');

  const opts = q.options.map((o,i) =>
    `<button class="quiz-option" id="qo-${i}" onclick="answerQuiz(${i})">${o}</button>`
  ).join('');

  document.getElementById('screen-quiz').innerHTML = `
    <div class="back-row">
      <button class="nav-btn outline" onclick="goBackToPlan()">← Back to Week</button>
    </div>
    <div class="quiz-header">
      <h2>🏆 ${t.days.weekend.title}</h2>
      <p>Question ${S.quizIdx + 1} of ${t.quiz.length}</p>
    </div>
    <div class="quiz-progress">${pips}</div>
    <div class="quiz-card">
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-options">${opts}</div>
      <div id="quiz-feedback"></div>
    </div>`;
}

function answerQuiz(chosen) {
  if (S.quizAnswered) return;
  S.quizAnswered = true;

  const t = TOPICS[S.topic];
  const q = t.quiz[S.quizIdx];
  const correct = chosen === q.ans;
  if (correct) S.quizScore++;

  document.querySelectorAll('.quiz-option').forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('correct');
    else if (i === chosen && !correct) btn.classList.add('wrong');
  });

  document.getElementById('quiz-feedback').innerHTML = `
    <div class="quiz-explain">${correct ? '✅ Correct! ' : `❌ Not quite. The answer was: <strong>${q.options[q.ans]}</strong>. `}${q.explain}</div>
    <button class="quiz-next-btn" onclick="nextQuestion()">${S.quizIdx < t.quiz.length - 1 ? 'Next Question →' : 'See My Score 🏆'}</button>`;
}

function nextQuestion() {
  S.quizIdx++;
  S.quizAnswered = false;
  if (S.quizIdx >= TOPICS[S.topic].quiz.length) {
    S.quizDone = true;
  }
  renderQuiz();
}

function renderQuizResult() {
  const t = TOPICS[S.topic];
  const pct = Math.round((S.quizScore / t.quiz.length) * 100);
  const msgs = [
    [5,'🏆 PERFECT SCORE! You\'re a true expert! Amazing work, Jimmy!'],
    [4,'⭐ Excellent! You really know your stuff — just one slip!'],
    [3,'👍 Great effort! You\'ve learned a lot this week. Keep going!'],
    [2,'💪 Good try! Review the passages and take it again — you\'ve got this!'],
    [0,'📚 Keep reading and you\'ll ace it next time! Every expert started here.']
  ];
  const msg = msgs.find(([min]) => S.quizScore >= min)[1];

  document.getElementById('screen-quiz').innerHTML = `
    <div class="quiz-result">
      <div class="score-ring">
        <div class="score-num">${S.quizScore}/${t.quiz.length}</div>
        <div class="score-label">Score</div>
      </div>
      <h3>${msg}</h3>
      <p>You scored ${pct}% on the ${t.name} Quiz!</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn-try" onclick="showQuiz()">Try Again</button>
        <button class="btn-try" style="background:var(--accent)" onclick="goBackToPlan()">← Back to Week</button>
      </div>
    </div>`;
}

/* ─────────────────────────────────────────────
   MARKDOWN DOWNLOAD
───────────────────────────────────────────── */
function downloadMd() {
  const t = TOPICS[S.topic];
  const today = new Date().toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'});
  let md = `# ${t.emoji} JimmyLearn — ${t.name}\n**Week of ${today}**\n\n---\n\n`;

  md += `## 📅 Weekly Overview\n\n| Day | Activity | Title |\n|-----|----------|-------|\n`;
  DAY_ORDER.forEach(dk => {
    const d = t.days[dk];
    md += `| ${d.day} | ${d.emoji} ${d.type} | ${d.title} |\n`;
  });

  md += `\n---\n\n## 📖 Monday: ${t.days.mon.title}\n\n`;
  const strip = html => html.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&mdash;/g,'—').replace(/&middot;/g,'·').replace(/&nbsp;/g,' ');
  md += strip(t.days.mon.passage) + '\n\n';
  md += '### 📝 Vocabulary\n\n';
  t.days.mon.vocab.forEach(v => { md += `**${v.word}** — ${v.def}\n\n`; });
  md += '### 💭 Questions to Think About\n\n';
  t.days.mon.questions.forEach((q,i) => { md += `${i+1}. ${q}\n`; });

  md += `\n---\n\n## 🧠 Tuesday: ${t.days.tue.title} (Mind Map)\n\n`;
  md += `**Central idea:** ${t.days.tue.center}\n\n**Branches to explore:**\n`;
  t.days.tue.nodes.forEach(n => { md += `- ${n}\n`; });
  md += `\n${t.days.tue.tip}\n\n${t.days.tue.challenge}\n`;

  md += `\n---\n\n## 🔬 Wednesday: ${t.days.wed.title}\n\n${t.days.wed.intro || ''}\n\n### What You'll Need\n`;
  t.days.wed.materials.forEach(m => { md += `- ${m}\n`; });
  md += '\n### Steps\n';
  t.days.wed.steps.forEach((s,i) => { md += `${i+1}. ${s}\n`; });
  md += `\n${t.days.wed.wonder}\n`;

  md += `\n---\n\n## ✍️ Thursday: ${t.days.thu.title}\n\n${t.days.thu.intro}\n\n`;
  t.days.thu.prompts.forEach(p => { md += `**${p.num}:** ${p.text}\n\n`; });

  md += `\n---\n\n## 📚 Friday: ${t.days.fri.title}\n\n**Book:** ${t.days.fri.book}  \n**Author:** ${t.days.fri.author}\n\n${t.days.fri.readThis}\n\n`;
  t.days.fri.questions.forEach(q => { md += `- ${q}\n`; });

  md += `\n---\n\n## 🏆 Weekend: ${t.days.weekend.title}\n\nOpen JimmyLearn and take the 5-question quiz on ${t.name}!\n`;

  md += `\n---\n\n## 📚 This Week's Book Recommendations\n\n`;
  t.books.forEach((b,i) => {
    md += `### ${i+1}. ${b.title}\n*${b.author}* | ${b.ages}\n\n${b.why}\n\n`;
  });

  md += `---\n*Generated by JimmyLearn • ${today}*\n`;

  const blob = new Blob([md], {type:'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `JimmyLearn_${t.name.replace(/\s+/g,'_')}_Week.md`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

  showScreen('welcome');
}

  if (S.topic) { renderPlan(); showScreen('plan'); }
  else showScreen('welcome');
}
